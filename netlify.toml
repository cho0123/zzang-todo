# Netlify 배포 설정 (정적 사이트 public/ + 경제지표 프록시 함수)
[build]
  # 배포 대상은 public 폴더만 (netlify/functions 소스는 노출되지 않음)
  publish = "public"

# 서버리스 함수 (After10 경제지표 프록시)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 기본 보안 헤더
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
