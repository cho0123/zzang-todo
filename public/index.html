<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>짱구 ToDo Fixed</title>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; width: 100%; max-width: 1000px; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #333; margin-bottom: 5px; letter-spacing: -1px; }
        .sub-title { text-align: center; color: #888; font-size: 12px; margin-bottom: 25px; }
        
        /* 입력 영역 */
        .input-group { 
            background: #f8f9fa; 
            padding: 20px; 
            border-radius: 10px; 
            border: 1px solid #e1e4e8;
            margin-bottom: 20px; 
            display: flex; flex-direction: column; gap: 12px; 
        }
        
        input, select, textarea { 
            padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px;
            background-color: #fff;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #333; }
        textarea { resize: none; }

        /* 시간 입력 그룹 */
        .time-group { display: flex; gap: 5px; flex: 1.5; }
        .time-group select { flex: 1; min-width: 60px; text-align: center; }
        .time-group input { flex: 1; text-align: center; }

        /* 체크박스 스타일 */
        .checkbox-wrapper { display: flex; align-items: center; }
        .checkbox-wrapper input[type="checkbox"] { display: none; }
        .checkbox-wrapper label {
            background-color: #fff; border: 1px solid #ddd; color: #aaa;
            padding: 10px 0; border-radius: 8px; cursor: pointer;
            font-weight: bold; font-size: 13px; display: block; width: 100%;
            text-align: center; transition: 0.2s; box-sizing: border-box;
        }
        
        #impCheck:checked + label { background-color: #f59f00; color: white; border-color: #f59f00; }
        #repeatCheck:checked + label { background-color: #be4bdb; color: white; border-color: #be4bdb; }
        #pinCheck:checked + label { background-color: #228be6; color: white; border-color: #228be6; }

        /* 버튼 그룹 */
        .btn-area { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
        button { border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; flex: 1; font-size: 14px; color: white; }
        #add-btn { background-color: #212529; width: 100%; }
        
        .edit-mode-btns { display: none; width: 100%; gap: 5px; }
        #update-btn { background-color: #228be6; flex: 2; } 
        #complete-btn { background-color: #40c057; flex: 1; } 
        #delete-btn { background-color: #fa5252; flex: 1; } 
        #cancel-btn { background-color: #868e96; flex: 0.5; } 

        /* 필터 버튼 */
        .filter-group { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 5px; -webkit-overflow-scrolling: touch; }
        .filter-btn { 
            padding: 8px 12px; border-radius: 20px; font-size: 12px; white-space: nowrap; 
            background: #f1f3f5; color: #868e96; border: 1px solid #dee2e6; flex: none; cursor: pointer;
        }
        .filter-btn.active { background: #333; color: white; border-color: #333; }

        /* 리스트 스타일 */
        ul { list-style: none; padding: 0; margin: 0; border-top: 3px solid #333; }
        li { 
            border-bottom: 2px solid #dde2e5; padding: 0;
            position: relative; overflow: hidden;
        }
        li:last-child { border-bottom: none; }

        /* 스와이프 배경 (색·문구는 JS에서 완료 여부에 맞춤) */
        .swipe-bg {
            position: absolute; left: 0; top: 0; bottom: 0; width: 100%;
            background-color: #40c057; color: #fff; font-weight: 800; font-size: 15px;
            display: flex; align-items: center; padding-left: 18px; box-sizing: border-box;
            z-index: 0; pointer-events: none;
        }
        .swipe-content {
            position: relative; z-index: 1;
            display: flex; gap: 15px; align-items: flex-start;
            padding: 18px 15px; width: 100%; box-sizing: border-box;
            background: #fff; cursor: pointer;
            transition: transform 0.28s ease-out;
            touch-action: pan-y;
        }
        .swipe-content.swipe-no-transition { transition: none; }

        li:hover .swipe-content { background-color: #f8f9fa; }

        /* 핀 고정된 항목 배경색 (연한 핑크) */
        li.pinned .swipe-content { background-color: #fff0f6; }
        li.pinned:hover .swipe-content { background-color: #ffdeeb; }
        
        .row-num { font-size: 12px; color: #adb5bd; font-weight: bold; min-width: 25px; margin-top: 3px; }
        .content-area { flex: 1; display: flex; flex-direction: column; gap: 4px; }

        /* 뱃지 및 색상 */
        .badges { display: flex; gap: 6px; font-size: 11px; font-weight: 700; align-items: center; flex-wrap: wrap; margin-bottom: 2px; }
        .badge { padding: 3px 6px; border-radius: 4px; color: white; }
        
        .cat-vt { background-color: #7950f2; }      
        .cat-botiz { background-color: #228be6; }   
        .cat-money { background-color: #2f9e44; }   
        .cat-general { background-color: #868e96; } 

        .type-date { background-color: #e64980; } 
        .type-time { background-color: #1098ad; }
        .type-repeat { background-color: #be4bdb; } 
        .imp-icon { color: #fa5252; font-weight: 800; font-size: 13px; }

        /* 리스트 내 핀 버튼 */
        .task-line { display: flex; align-items: center; gap: 8px; }
        .inline-pin-btn {
            background: none; border: none; padding: 0; cursor: pointer; margin: 0; flex: none;
            font-size: 18px; color: #e9ecef; transition: all 0.2s; line-height: 1;
        }
        .inline-pin-btn.active { color: #fa5252; transform: rotate(-45deg); } 
        .inline-pin-btn:hover { transform: scale(1.2); }

        .task-text { font-size: 16px; font-weight: 600; color: #333; line-height: 1.4; flex: 1; }
        .task-memo { font-size: 13px; color: #868e96; margin-top: 2px; margin-left: 1px; }

        /* 완료된 항목 */
        li.completed .swipe-content { opacity: 0.5; background-color: #f1f3f5; }
        li.completed .task-text { text-decoration: line-through; color: #ced4da; }
        li.completed .badges { filter: grayscale(100%); opacity: 0.7; }

        /* 섹션 헤더 (오늘 할 일 / 장기일정) */
        .section-header {
            font-size: 14px; font-weight: 800; color: #495057; letter-spacing: -0.5px;
            margin: 22px 0 8px; display: flex; align-items: center; gap: 6px;
        }
        .section-header .count { font-size: 12px; color: #adb5bd; font-weight: 600; }

        /* 2단 레이아웃 (좌: 오늘 일정 / 우: 장기 플랜)
           가로 폭이 충분하면(≈2×250px) 자동으로 좌우 2단, 좁으면 위아래로 쌓임 */
        .columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr));
            gap: 24px;
            align-items: start;
            margin-top: 10px;
        }
        .column { min-width: 0; }
        .column .section-header { margin-top: 0; }

        /* 장기 플랜 리스트는 파란 상단선으로 구분 */
        #longColumn ul { border-top: 3px solid #1c7ed6; }

        /* 빈 상태 안내 문구 */
        .empty-msg { text-align: center; padding: 30px 10px; color: #adb5bd; font-size: 13px; }

        /* 날짜 옆 '오늘' 버튼 */
        .date-wrap { display: flex; gap: 6px; align-items: stretch; }
        .today-btn {
            flex: none; width: auto; padding: 0 14px;
            background: #e7f5ff; color: #1c7ed6; border: 1px solid #a5d8ff;
            border-radius: 8px; font-size: 13px; font-weight: 700; white-space: nowrap;
            cursor: pointer;
        }
        .today-btn:hover { background: #d0ebff; }

        /* 장기일정 관련 뱃지 */
        .type-due { background-color: #f76707; }
        .badge.dday { color: #fff; }

        /* 마감 임박 항목 (오늘 목록 상단 노출) */
        li.imminent .swipe-content { background-color: #fff9db; }
        li.imminent:hover .swipe-content { background-color: #fff3bf; }

        /* 장기 전용 필드(마감일) */
        #longFields { align-items: center; }

        /* ===================== After10 (일지) ===================== */
        /* 포인트 컬러: #364fc7 (남색) — 기존 팔레트와 겹치지 않음 */

        /* 상단 탭 (ToDo / After10) */
        .tab-group { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; }
        .tab-btn {
            padding: 11px 24px; border-radius: 22px; font-size: 14px; font-weight: 700;
            background: #f1f3f5; color: #868e96; border: 1px solid #dee2e6;
            cursor: pointer; flex: none; white-space: nowrap; transition: 0.2s;
        }
        .tab-btn:hover { background: #e9ecef; }
        .tab-btn.active { background: #364fc7; color: #fff; border-color: #364fc7; }

        /* After10 내부 뷰 전환 버튼 */
        .a10-viewtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
        .a10-viewbtn {
            padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
            background: #f1f3f5; color: #868e96; border: 1px solid #dee2e6;
            cursor: pointer; flex: none; white-space: nowrap; transition: 0.2s;
        }
        .a10-viewbtn:hover { background: #e9ecef; }
        .a10-viewbtn.active { background: #364fc7; color: #fff; border-color: #364fc7; }

        /* 뷰1: 오늘 쓰기 */
        .a10-concept { font-size: 12px; color: #adb5bd; text-align: center; letter-spacing: -0.3px; margin-bottom: 6px; }
        .a10-date { font-size: 20px; font-weight: 800; color: #364fc7; text-align: center; letter-spacing: -0.5px; margin-bottom: 16px; }
        .a10-editing-note { font-size: 12px; font-weight: 700; color: #f76707; text-align: center; margin: -10px 0 14px; }
        #a10Content {
            width: 100%; min-height: 260px; padding: 16px;
            border: 1px solid #e1e4e8; border-radius: 8px; box-sizing: border-box;
            font-family: inherit; font-size: 15px; line-height: 1.7; color: #333;
            background: #fff; resize: vertical;
        }
        #a10Content:focus { outline: none; border-color: #364fc7; }
        .a10-btnrow { display: flex; gap: 8px; margin-top: 12px; }
        .a10-save-btn { background-color: #364fc7; flex: 1; }
        .a10-save-btn.saved { background-color: #40c057; }
        .a10-sub-btn { background-color: #868e96; flex: none; padding: 12px 16px; }

        /* 기록할 날짜 선택 */
        .a10-datepick { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
        .a10-datepick input[type="date"] { flex: 0 1 190px; text-align: center; }

        /* 최근 기록 (쓰기 뷰 하단) */
        .a10-recent { margin-top: 32px; padding-top: 22px; border-top: 1px solid #e1e4e8; }
        .a10-recent-title {
            font-size: 14px; font-weight: 800; color: #495057; letter-spacing: -0.5px;
            display: flex; align-items: center; gap: 6px; margin-bottom: 12px;
        }
        .a10-recent-count { font-size: 12px; font-weight: 600; color: #adb5bd; }
        .a10-card-compact { padding: 12px 14px; }
        .a10-card.current { border-color: #364fc7; background: #edf2ff; }
        .a10-card-body.clamp {
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* 리스트 서브타이틀 (+10년 뒤 짱구에게) */
        .a10-card-sub { font-size: 11px; font-weight: 700; color: #364fc7; margin-bottom: 8px; }

        /* 경제지표 한 줄 */
        .a10-market {
            margin-top: 9px; padding-top: 8px; border-top: 1px dashed #e9ecef;
            font-size: 11px; color: #495057; line-height: 1.7; word-break: keep-all;
        }
        .a10-market b { color: #212529; font-weight: 700; }
        .a10-market .a10-basis { color: #adb5bd; font-weight: 600; }

        /* 뷰2: 전체 타임라인 — 연/월 접이식 */
        .a10-caret { font-size: 11px; width: 10px; flex: none; }
        .a10-cnt { margin-left: auto; font-size: 11px; font-weight: 700; }

        .a10-year-block { margin-bottom: 10px; }
        .a10-year-head {
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            padding: 12px 14px; border-radius: 8px;
            background: #f8f9fa; border: 1px solid #e1e4e8; transition: 0.15s;
        }
        .a10-year-head:hover { background: #edf2ff; border-color: #364fc7; }
        .a10-year-head.open { background: #364fc7; border-color: #364fc7; color: #fff; }
        .a10-year-label { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; }
        .a10-year-head .a10-cnt { color: #adb5bd; }
        .a10-year-head.open .a10-cnt { color: #fff; opacity: 0.8; }
        .a10-year-body { padding: 10px 0 4px 10px; }

        .a10-month-block { margin-bottom: 8px; }
        .a10-month-head {
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            padding: 9px 12px; border-radius: 6px;
            background: #fff; border: 1px solid #e1e4e8;
            font-size: 13px; font-weight: 800; color: #495057; transition: 0.15s;
        }
        .a10-month-head:hover { border-color: #364fc7; color: #364fc7; }
        .a10-month-head.open { background: #f8f9ff; border-color: #a5b4e8; color: #364fc7; }
        .a10-month-head .a10-cnt { color: #adb5bd; }
        .a10-month-body { margin-left: 6px; padding: 10px 0 6px 8px; border-left: 2px solid #e1e4e8; }
        .a10-card {
            background: #fff; border: 1px solid #e1e4e8; border-radius: 8px;
            padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: 0.15s;
        }
        .a10-card:hover { border-color: #364fc7; background: #f8f9fa; }
        .a10-card-date { font-size: 12px; font-weight: 800; color: #868e96; margin-bottom: 6px; }
        .a10-card-body { font-size: 14px; color: #333; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }

        /* 뷰3: 과거의 오늘 */
        .a10-past-card {
            background: #fff; border: 1px solid #e1e4e8; border-left: 4px solid #364fc7;
            border-radius: 8px; padding: 18px; margin-bottom: 12px;
        }
        .a10-past-year { font-size: 18px; font-weight: 800; color: #364fc7; letter-spacing: -0.5px; margin-bottom: 10px; }
        .a10-hint {
            text-align: center; color: #adb5bd; font-size: 13px; line-height: 1.7;
            padding: 18px 12px; border: 1px dashed #dee2e6; border-radius: 8px; margin-top: 4px;
        }
        .a10-empty { text-align: center; color: #adb5bd; font-size: 13px; line-height: 1.7; padding: 40px 10px; }

        /* 지표 흐름 (차트) */
        .a10-chart-metrics { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .a10-chart-modes { display: flex; gap: 6px; margin-bottom: 8px; }
        .a10-chart-ranges { display: flex; gap: 6px; margin-bottom: 14px; }
        .a10-chip, .a10-chip2 {
            flex: none; width: auto; white-space: nowrap;
            padding: 7px 13px; border-radius: 20px; font-size: 12px; font-weight: 700;
            background: #f1f3f5; color: #868e96; border: 1px solid #dee2e6; cursor: pointer;
        }
        .a10-chip:hover, .a10-chip2:hover { background: #e9ecef; }
        .a10-chip.active, .a10-chip2.active { background: #364fc7; color: #fff; border-color: #364fc7; }
        .a10-chart-box { position: relative; height: 300px; margin-bottom: 14px; }
        .a10-chart-stats { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; font-size: 13px; color: #495057; }
        .a10-chart-stats b { color: #212529; }
        .a10-chart-stats .up { color: #e03131; }
        .a10-chart-stats .down { color: #1c7ed6; }

        /* ===================== 로그인 게이트 ===================== */
        #loginScreen { width: 100%; max-width: 360px; margin-top: 8vh; }
        .login-card {
            background: #fff; padding: 34px 26px; border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center;
        }
        .login-title { margin-bottom: 6px; }
        .login-sub { color: #888; font-size: 12px; margin-bottom: 26px; }
        #loginScreen input {
            width: 100%; padding: 13px; margin-bottom: 10px; box-sizing: border-box;
            border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fff;
        }
        #loginScreen input:focus { outline: none; border-color: #212529; }
        #loginBtn {
            width: 100%; padding: 13px; margin-top: 6px;
            background: #212529; color: #fff; font-weight: bold; font-size: 14px;
        }
        #loginBtn:disabled { opacity: 0.6; cursor: default; }
        .login-error { display: none; margin-top: 14px; color: #e03131; font-size: 13px; font-weight: 600; line-height: 1.5; }

        /* 로그아웃 버튼 (상단 우측, 작게) */
        #logoutBtn {
            position: fixed; top: 12px; right: 12px; z-index: 100; flex: none; width: auto;
            padding: 6px 13px; border: 1px solid #dee2e6; border-radius: 20px;
            background: rgba(255,255,255,0.92); color: #868e96; font-size: 12px; font-weight: 700;
        }
        #logoutBtn:hover { background: #f1f3f5; color: #495057; }

        /* ===================== 건강 기록 (health) =====================
           포인트 컬러: #0ca678 (그린) — 기존(ToDo 다크, After10 남색)과 구분 */
        .hl-persons, .hl-views, .hl-types { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .hl-views { margin-bottom: 16px; }
        .hl-chip {
            flex: none; width: auto; white-space: nowrap;
            padding: 8px 15px; border-radius: 20px; font-size: 13px; font-weight: 700;
            background: #f1f3f5; color: #868e96; border: 1px solid #dee2e6; cursor: pointer;
        }
        .hl-chip:hover { background: #e9ecef; }
        .hl-chip.active { background: #0ca678; color: #fff; border-color: #0ca678; }
        .hl-chip.person.active { background: #364fc7; border-color: #364fc7; }  /* 인물은 남색으로 구분 */

        .hl-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
        .hl-meta input[type="date"] { flex: 0 1 180px; }
        .hl-meta input[type="text"] { flex: 1; min-width: 140px; }

        #hlPaste, #hlNote { width: 100%; min-height: 140px; padding: 14px; box-sizing: border-box;
            border: 1px solid #e1e4e8; border-radius: 8px; font-family: inherit; font-size: 14px; line-height: 1.6; resize: vertical; }
        #hlPaste:focus, #hlNote:focus { outline: none; border-color: #0ca678; }

        .hl-btnrow { display: flex; gap: 8px; margin: 10px 0; }
        .hl-analyze-btn { background: #0ca678; flex: none; padding: 11px 20px; }
        .hl-save-btn { background: #0ca678; flex: 1; }
        .hl-save-btn.saved { background: #40c057; }
        .hl-sub-btn { background: #868e96; flex: none; padding: 12px 16px; }
        .hl-save-msg { text-align: center; font-size: 13px; font-weight: 600; color: #0ca678; min-height: 18px; }
        .hl-parse-info { font-size: 12px; color: #868e96; margin: 6px 0 10px; }

        /* 항목 편집 표 */
        .hl-items-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 8px; }
        .hl-items-table th { background: #f1f3f5; color: #495057; font-weight: 700; padding: 6px 4px; border: 1px solid #e1e4e8; }
        .hl-items-table td { border: 1px solid #e9ecef; padding: 2px; }
        .hl-items-table input { width: 100%; border: none; padding: 6px 4px; font-size: 12px; box-sizing: border-box; background: transparent; }
        .hl-items-table input:focus { outline: 1px solid #0ca678; background: #fff; }
        .hl-items-table tr.abnormal td { background: #fff0f0; }
        .hl-items-table tr.failed td { background: #fff9db; }
        .hl-items-table .hl-del { color: #fa5252; cursor: pointer; text-align: center; font-weight: 800; }
        .hl-col-name { width: 26%; } .hl-col-val { width: 16%; } .hl-col-unit { width: 16%; } .hl-col-ref { width: 32%; } .hl-col-x { width: 6%; }
        .hl-addrow-btn { background: #f1f3f5; color: #495057; border: 1px dashed #ced4da; flex: none; padding: 8px 14px; font-size: 12px; }

        /* 기록 목록 */
        .hl-rec { background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 14px 15px; margin-bottom: 10px; }
        .hl-rec-head { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .hl-rec-date { font-size: 14px; font-weight: 800; color: #212529; }
        .hl-rec-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; color: #fff; }

<!-- 지표 흐름 차트용 (빌드 도구 없는 단일 HTML 유지) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, query, where, getDocs, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // Firebase 설정
    const firebaseConfig = {
        apiKey: "AIzaSyC1x5B7Nm6iFJ85UPye-vy-aWWefbwmZLw",
        authDomain: "cho-works.firebaseapp.com",
        projectId: "cho-works",
        storageBucket: "cho-works.firebasestorage.app",
        messagingSenderId: "595194586746",
        appId: "1:595194586746:web:249edc78bb6c4680da7dc3",
        measurementId: "G-28FZEQKMGE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const TASKS_COLLECTION = "tasks";

    let isEditing = false;
    let currentEditId = null;
    let currentFilter = 'all';

    function formatTimeInput() {
        const ampm = document.getElementById('ampmInput').value;
        let hour = parseInt(document.getElementById('hourInput').value);
        let minute = parseInt(document.getElementById('minuteInput').value);

        if (isNaN(hour) || isNaN(minute)) return ""; 

        if (ampm === "PM" && hour < 12) hour += 12;
        if (ampm === "AM" && hour === 12) hour = 0;

        return `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
    }

    function setTimeInput(timeStr) {
        if (!timeStr) {
            document.getElementById('ampmInput').value = 'PM';
            document.getElementById('hourInput').value = '';
            document.getElementById('minuteInput').value = '';
            return;
        }

        let [h, m] = timeStr.split(':').map(Number);
        let ampm = h >= 12 ? 'PM' : 'AM';
        
        if (h > 12) h -= 12;
        if (h === 0) h = 12;

        document.getElementById('ampmInput').value = ampm;
        document.getElementById('hourInput').value = h;
        document.getElementById('minuteInput').value = m;
    }

    // 마감일까지 남은 D-day 계산 (날짜 기준)
    function getDDay(dueDate) {
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const [y, mo, d] = dueDate.split('-').map(Number);
        const due = new Date(y, mo - 1, d);
        const diff = Math.round((due - today) / 86400000);
        let label;
        if (diff === 0) label = 'D-day';
        else if (diff > 0) label = 'D-' + diff;
        else label = 'D+' + Math.abs(diff);
        return { diff, label };
    }

    // D-day 임박도에 따른 색상
    function ddayColor(diff) {
        if (diff < 0) return '#e03131';   // 지남
        if (diff === 0) return '#f03e3e'; // 당일
        if (diff <= 3) return '#f59f00';  // 임박
        return '#1c7ed6';                 // 여유
    }

    // 카테고리 정렬 우선순위: 보이스튜닝 > 보티즈 > 머니 > 일반
    const CAT_ORDER = { vt: 0, botiz: 1, money: 2, general: 3 };
    const catRank = t => (CAT_ORDER[t.category] !== undefined ? CAT_ORDER[t.category] : 99);

    // 일정 타입(단기/장기)에 따른 입력 필드 표시 전환
    function applyScheduleTypeUI(type) {
        const isLong = type === 'long';
        document.getElementById('shortFields').style.display = isLong ? 'none' : 'flex';
        document.getElementById('longFields').style.display = isLong ? 'flex' : 'none';
    }

    document.getElementById('scheduleTypeInput').addEventListener('change', (e) => {
        applyScheduleTypeUI(e.target.value);
    });

    // 로컬 기준 오늘 날짜(YYYY-MM-DD)
    function todayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    document.getElementById('todayBtnShort').addEventListener('click', () => {
        document.getElementById('dateInput').value = todayStr();
    });

    window.setFilter = function(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.filter-btn[data-filter="${filter}"]`).classList.add('active');
        renderTasks(window.allTasks || []);
    };

    window.togglePin = async function(event, id, currentStatus) {
        event.stopPropagation(); 
        try {
            const taskRef = doc(db, TASKS_COLLECTION, id);
            await updateDoc(taskRef, { isPinned: !currentStatus });
        } catch (e) { console.error("핀 토글 실패:", e); }
    };

    window.toggleComplete = async function(taskId, currentStatus) {
        try {
            const newStatus = !currentStatus;
            await updateDoc(doc(db, TASKS_COLLECTION, taskId), {
                isCompleted: newStatus,
                completedAt: newStatus ? Date.now() : null
            });
        } catch (e) { console.error("완료 토글 실패:", e); }
    };

    document.getElementById('add-btn').addEventListener('click', addTask);
    document.getElementById('update-btn').addEventListener('click', updateTaskAction);
    document.getElementById('delete-btn').addEventListener('click', deleteTaskAction);
    document.getElementById('complete-btn').addEventListener('click', completeTaskAction);
    document.getElementById('cancel-btn').addEventListener('click', resetForm);

    // [로그인 게이트] 기존 tasks 구독/정리를 로그인 확인 후 실행하도록 호출 시점만 이동.
    // (아래 블록 내부 로직은 원본 그대로 — 최초 1회만 실행)
    let __todoStarted = false;
    let __todoUnsub = null;   // onSnapshot 해제 함수 보관
    function startTodoData() {
        if (__todoStarted) return;
        __todoStarted = true;

        const q = collection(db, TASKS_COLLECTION);
        __todoUnsub = onSnapshot(q, (snapshot) => {
            const tasks = [];
            snapshot.forEach((doc) => {
                tasks.push({ id: doc.id, ...doc.data() });
            });
            window.allTasks = tasks;
            renderTasks(tasks);
        });

        cleanUpOldTasks();
    }

    // 로그아웃 시: 구독 해제 + 상태/데이터 초기화 (재로그인 시 startTodoData 재실행 가능)
    function stopTodoData() {
        if (__todoUnsub) { __todoUnsub(); __todoUnsub = null; }
        __todoStarted = false;
        window.allTasks = undefined;
        a10Entries = [];   // After10 diary 캐시도 정리
    }

    async function addTask() {
        const text = document.getElementById('taskInput').value;
        const scheduleType = document.getElementById('scheduleTypeInput').value;
        const category = document.getElementById('categoryInput').value;
        const isImportant = document.getElementById('impCheck').checked;
        const isRepeat = document.getElementById('repeatCheck').checked;
        const isPinned = document.getElementById('pinCheck').checked;
        const memo = document.getElementById('memoInput').value;

        if (text.trim() === '') return alert('내용을 입력해주세요.');

        const isLong = scheduleType === 'long';
        // 장기 플랜의 마감일은 선택 입력 (없어도 등록 가능)
        const dueDate = isLong ? document.getElementById('dueDateInput').value : '';
        const targetDate = isLong ? '' : document.getElementById('dateInput').value;
        const targetTime = isLong ? '' : formatTimeInput();

        try {
            await addDoc(collection(db, TASKS_COLLECTION), {
                text, category, scheduleType, dueDate, isImportant, isRepeat, isPinned, memo, targetDate, targetTime,
                isCompleted: false, createdAt: Date.now(), completedAt: null
            });
            resetForm();
        } catch (e) { console.error("Error adding: ", e); }
    }

    function renderTasks(tasks) {
        // 일정 타입으로 분리 (타입 없는 기존 데이터는 '단기'로 취급)
        const shortTasks = [];
        const longTasks = [];
        tasks.forEach(t => {
            if (t.scheduleType === 'long') longTasks.push(t);
            else shortTasks.push(t);
        });

        renderLongSection(longTasks);

        const list = document.getElementById('taskList');
        list.innerHTML = '';

        // 마감 임박(D-3 이내, 미완료) 장기일정을 오늘 목록 상단에 노출
        const imminent = longTasks
            .filter(t => !t.isCompleted && t.dueDate && getDDay(t.dueDate).diff <= 3)
            .sort((a, b) => getDDay(a.dueDate).diff - getDDay(b.dueDate).diff);
        imminent.forEach(task => list.appendChild(createTaskItem(task, '⏰', true)));

        let filteredTasks = shortTasks.filter(task => {
            if (currentFilter === 'all') return true;
            if (currentFilter === 'important') return !!task.isImportant || !!task.isPinned;
            return (task.category || 'general') === currentFilter;
        });

        filteredTasks.sort((a, b) => {
            // 완료는 하단으로
            if (!!a.isCompleted !== !!b.isCompleted) return a.isCompleted ? 1 : -1;

            // 속성(고정/날짜/우선)이 있는 항목은 상단, 아무것도 없는 항목은 하단
            const aAttr = !!a.isPinned || !!a.targetDate || !!a.isImportant;
            const bAttr = !!b.isPinned || !!b.targetDate || !!b.isImportant;
            if (aAttr !== bAttr) return aAttr ? -1 : 1;

            if (aAttr && bAttr) {
                // 1) 고정
                if (!!a.isPinned !== !!b.isPinned) return a.isPinned ? -1 : 1;
                // 2) 날짜 (있는 것 먼저, 빠른 날짜·시간 순)
                const aHasDate = !!a.targetDate, bHasDate = !!b.targetDate;
                if (aHasDate !== bHasDate) return aHasDate ? -1 : 1;
                if (aHasDate && bHasDate) {
                    const ad = a.targetDate + (a.targetTime || ''), bd = b.targetDate + (b.targetTime || '');
                    if (ad !== bd) return ad < bd ? -1 : 1;
                }
                // 3) 우선(중요)
                if (!!a.isImportant !== !!b.isImportant) return a.isImportant ? -1 : 1;
                // 동순위는 카테고리 순
                return catRank(a) - catRank(b);
            }

            // 아무 선택 없는 항목: 카테고리 순 (보이스튜닝 > 보티즈 > 머니 > 일반)
            return catRank(a) - catRank(b);
        });

        const totalCount = filteredTasks.length;
        filteredTasks.forEach((task, index) => {
            list.appendChild(createTaskItem(task, totalCount - index, false));
        });

        const shortActive = filteredTasks.filter(t => !t.isCompleted).length;
        document.getElementById('shortCount').textContent = shortActive ? `(${shortActive})` : '';

        if (imminent.length === 0 && filteredTasks.length === 0) {
            list.innerHTML = '<div class="empty-msg">할 일이 없습니다.</div>';
        }
    }

    // 장기 플랜 렌더링 (마감일 있는 항목이 가까운 순으로 먼저, 완료는 하단)
    function renderLongSection(longTasks) {
        const list = document.getElementById('longList');
        list.innerHTML = '';

        if (!longTasks.length) {
            document.getElementById('longCount').textContent = '';
            list.innerHTML = '<div class="empty-msg">아직 장기 플랜이 없어요.<br>등록 시 "🌱 장기(플랜)"을 선택해 추가하세요.</div>';
            return;
        }

        const sorted = longTasks.slice().sort((a, b) => {
            // 완료 항목은 하단으로
            if (!!a.isCompleted !== !!b.isCompleted) return a.isCompleted ? 1 : -1;
            // 카테고리 순서 (vt > botiz > money > general)
            const ca = catRank(a), cb = catRank(b);
            if (ca !== cb) return ca - cb;
            // 같은 카테고리 내에서 '우선'(중요) 항목을 상단으로
            if (!!a.isImportant !== !!b.isImportant) return a.isImportant ? -1 : 1;
            // 마감일 있는 항목을 먼저(가까운 순), 없는 항목은 뒤로
            const aHas = !!a.dueDate, bHas = !!b.dueDate;
            if (aHas !== bHas) return aHas ? -1 : 1;
            if (aHas && bHas) return a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0;
            // 둘 다 마감일 없으면 최근 등록순
            return (b.createdAt || 0) - (a.createdAt || 0);
        });

        const activeCount = sorted.filter(t => !t.isCompleted).length;
        document.getElementById('longCount').textContent = activeCount ? `(${activeCount})` : '';

        sorted.forEach((task, index) => {
            list.appendChild(createTaskItem(task, index + 1, false));
        });
    }

    // 뱃지 영역(날짜/시간/마감일/D-day/반복) 생성
    function buildTypeHtml(task) {
        let typeHtml = '';
        if (task.scheduleType === 'long') {
            if (task.dueDate) {
                const dueShort = task.dueDate.substring(5).replace('-', '/');
                typeHtml += `<span class="badge type-due">📅 ${dueShort}</span>`;
                const dd = getDDay(task.dueDate);
                typeHtml += `<span class="badge dday" style="background-color:${ddayColor(dd.diff)}">${dd.label}</span>`;
            }
        } else if (task.targetDate) {
            const dateShort = task.targetDate.substring(5).replace('-', '/');
            const dd = getDDay(task.targetDate);
            if (dd.diff === 0) {
                // 오늘 마감
                typeHtml += `<span class="badge" style="background-color:#f76707;">오늘</span>`;
            } else if (dd.diff < 0 && !task.isCompleted) {
                // 처리 안 된 지난 일정: 날짜 + D+n
                typeHtml += `<span class="badge type-date">${dateShort}</span>`;
                typeHtml += `<span class="badge" style="background-color:#e03131;">${dd.label}</span>`;
            } else {
                typeHtml += `<span class="badge type-date">${dateShort}</span>`;
            }

            if (task.targetTime) {
                let [h, m] = task.targetTime.split(':').map(Number);
                let ampm = h >= 12 ? 'PM' : 'AM';
                if (h > 12) h -= 12;
                if (h === 0) h = 12;
                const timeShort = `${ampm} ${h}:${m.toString().padStart(2,'0')}`;
                typeHtml += `<span class="badge type-time">${timeShort}</span>`;
            }
        }
        if (task.isRepeat) {
            typeHtml += `<span class="badge type-repeat">🔄 반복</span>`;
        }
        return typeHtml;
    }

    // 개별 항목(li) 생성 — 오늘 목록/장기 섹션 공통 사용
    // numLabel: 순번 또는 '⏰' 같은 표시, isImminent: 마감임박 강조 여부
    function createTaskItem(task, numLabel, isImminent) {
            const li = document.createElement('li');
            if (task.isCompleted) li.classList.add('completed');
            if (task.isPinned) li.classList.add('pinned');
            if (isImminent) li.classList.add('imminent');
            li.setAttribute('data-completed', task.isCompleted ? 'true' : 'false');

            const catLabels = { 'vt': 'VT', 'botiz': '보티즈', 'money': '머니', 'general': '일반' };
            const catKey = task.category || 'general';

            const typeHtml = buildTypeHtml(task);

            const impHtml = task.isImportant ? '<span class="badge" style="background-color:#f59f00;">⭐ 우선</span>' : '';
            const imminentHtml = isImminent ? '<span class="imp-icon" style="color:#f76707;">⏰ 마감임박</span>' : '';

            let memoHtml = '';
            if (task.memo) {
                const onelineMemo = task.memo.replace(/\n/g, " / ");
                memoHtml = `<div class="task-memo">└ ${onelineMemo}</div>`;
            }

            let statusMsg = '';
            if (task.isCompleted && task.completedAt) {
                const deleteTime = task.completedAt + (36 * 60 * 60 * 1000);
                const delDate = new Date(deleteTime);
                const month = delDate.getMonth() + 1;
                const day = delDate.getDate();
                const hours = delDate.getHours().toString().padStart(2, '0');
                const minutes = delDate.getMinutes().toString().padStart(2, '0');
                statusMsg = `<span style="font-size:11px; color:#aaa; margin-left:auto;">(${month}/${day} ${hours}:${minutes} 삭제)</span>`;
            }

            const pinBtnClass = task.isPinned ? 'inline-pin-btn active' : 'inline-pin-btn';
            const pinIcon = '📌';

            const taskStr = encodeURIComponent(JSON.stringify(task));

            const swipeBg = document.createElement('div');
            swipeBg.className = 'swipe-bg';

            function syncSwipeBgFromLi() {
                const completed = li.getAttribute('data-completed') === 'true';
                swipeBg.style.backgroundColor = completed ? '#fab005' : '#40c057';
                swipeBg.textContent = completed ? '↩ 복구' : '✔ 완료';
            }
            syncSwipeBgFromLi();

            const swipeContent = document.createElement('div');
            swipeContent.className = 'swipe-content';
            swipeContent.innerHTML = `
                <div class="row-num">${numLabel}</div>
                <div class="content-area">
                    <div class="badges">
                        <span class="badge cat-${catKey}">${catLabels[catKey] || catKey}</span>
                        ${typeHtml}
                        ${imminentHtml}
                        ${impHtml}
                        ${statusMsg}
                    </div>
                    <div class="task-line">
                        <div class="task-text">${task.text}</div>
                        <button class="${pinBtnClass}" onclick="togglePin(event, '${task.id}', ${task.isPinned})">${pinIcon}</button>
                    </div>
                    ${memoHtml}
                </div>
            `;

            li.appendChild(swipeBg);
            li.appendChild(swipeContent);

            const SWIPE_COMMIT_PX = 80;
            const TAP_SLOP_PX = 12;
            let startX = 0;
            let startY = 0;
            let maxAbsDx = 0;
            let maxRightDx = 0;
            let dragging = false;

            function setTranslateX(px) {
                swipeContent.style.transform = `translateX(${px}px)`;
            }

            function resetPosition(animated) {
                if (animated) {
                    swipeContent.classList.remove('swipe-no-transition');
                } else {
                    swipeContent.classList.add('swipe-no-transition');
                }
                setTranslateX(0);
            }

            swipeContent.addEventListener('click', (e) => {
                if (swipeContent.dataset.suppressClick === '1') {
                    e.preventDefault();
                    e.stopPropagation();
                    delete swipeContent.dataset.suppressClick;
                    return;
                }
                openEditMode(taskStr);
            });

            function onPointerDown(e) {
                if (e.button !== undefined && e.button !== 0) return;
                if (e.target.closest && e.target.closest('.inline-pin-btn')) return;
                syncSwipeBgFromLi();
                startX = e.clientX;
                startY = e.clientY;
                maxAbsDx = 0;
                maxRightDx = 0;
                dragging = true;
                swipeContent.classList.add('swipe-no-transition');
                try { swipeContent.setPointerCapture(e.pointerId); } catch (_) {}
            }

            function onPointerMove(e) {
                if (!dragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                maxAbsDx = Math.max(maxAbsDx, Math.abs(dx));
                maxRightDx = Math.max(maxRightDx, dx);
                if (dx > 0) {
                    setTranslateX(dx);
                } else {
                    setTranslateX(0);
                }
            }

            function onPointerUp(e) {
                if (!dragging) return;
                dragging = false;
                try { swipeContent.releasePointerCapture(e.pointerId); } catch (_) {}

                const committed = maxRightDx >= SWIPE_COMMIT_PX;
                if (committed) {
                    swipeContent.dataset.suppressClick = '1';
                    window.toggleComplete(task.id, !!task.isCompleted);
                    resetPosition(true);
                } else {
                    resetPosition(true);
                    if (maxAbsDx > TAP_SLOP_PX) {
                        swipeContent.dataset.suppressClick = '1';
                    }
                }
            }

            function onPointerCancel(e) {
                if (!dragging) return;
                dragging = false;
                try { swipeContent.releasePointerCapture(e.pointerId); } catch (_) {}
                resetPosition(true);
                if (maxAbsDx > TAP_SLOP_PX) swipeContent.dataset.suppressClick = '1';
            }

            swipeContent.addEventListener('pointerdown', onPointerDown);
            swipeContent.addEventListener('pointermove', onPointerMove);
            swipeContent.addEventListener('pointerup', onPointerUp);
            swipeContent.addEventListener('pointercancel', onPointerCancel);

            return li;
    }

    async function cleanUpOldTasks() {
        const threshold = Date.now() - (36 * 60 * 60 * 1000);
        const q = query(

        );

        querySnapshot.forEach(async (docSnapshot) => {

    /* ===================== After10 (일지) =====================
       기존 tasks 로직과 완전히 독립.
       - 별도 컬렉션 "diary", 문서 ID = YYYY-MM-DD
       - onSnapshot 미사용: 탭 진입 시 / 저장 후에만 getDocs로 조회
    ========================================================== */
    const DIARY_COLLECTION = "diary";
    const A10_DAYS = ['일', '월', '화', '수', '목', '금', '토'];

    let a10Entries = [];       // 불러온 일지 문서들
    let a10CurrentDate = null; // 현재 작성/수정 중인 날짜(YYYY-MM-DD)

    function a10ParseDate(s) {
        const [y, m, d] = s.split('-').map(Number);
        return new Date(y, m - 1, d);
    }
    // 2026년 7월 18일 토요일
    function a10KoreanFull(s) {
        const d = a10ParseDate(s);
        return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${A10_DAYS[d.getDay()]}요일`;
    }
    // 7월 18일 (토)
    function a10KoreanShort(s) {
        const d = a10ParseDate(s);
        return `${d.getMonth() + 1}월 ${d.getDate()}일 (${A10_DAYS[d.getDay()]})`;
    }
    // 해당 날짜의 10년 뒤 Date
    function a10Plus10(s) {
        const d = a10ParseDate(s);
        return new Date(d.getFullYear() + 10, d.getMonth(), d.getDate());
    }
    // 생년월일 (만 나이 계산 기준)
    const A10_BIRTH = { y: 1978, m: 1, d: 23 };
    // 해당 시점의 만 나이 (생일 지났으면 +1)
    function a10AgeAt(dateObj) {
        let age = dateObj.getFullYear() - A10_BIRTH.y;
        const m = dateObj.getMonth() + 1;
        const d = dateObj.getDate();
        if (m < A10_BIRTH.m || (m === A10_BIRTH.m && d < A10_BIRTH.d)) age--;
        return age;
    }
    // 제목용: 2036년 7월 19일 토요일 58살 짱구에게..
    function a10FutureTitle(s) {
        const f = a10Plus10(s);
        return `${f.getFullYear()}년 ${f.getMonth() + 1}월 ${f.getDate()}일 ${A10_DAYS[f.getDay()]}요일 ${a10AgeAt(f)}살 짱구에게..`;
    }
    // 리스트 서브타이틀용: 2036년 7월 19일 58살 짱구에게
    function a10FutureSub(s) {
        const f = a10Plus10(s);
        return `${f.getFullYear()}년 ${f.getMonth() + 1}월 ${f.getDate()}일 ${a10AgeAt(f)}살 짱구에게`;
    }
    function a10Escape(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function a10FindEntry(dateStr) {
        return a10Entries.find(e => e.id === dateStr) || null;
    }

    // Firestore에서 일지 전체 조회 (구독 아님)
    async function a10FetchEntries() {
