    // 작성 폼에 특정 날짜 내용 채우기
    function a10FillWriteForm(dateStr) {
        a10CurrentDate = dateStr;
        const entry = a10FindEntry(dateStr);
        const isToday = dateStr === todayStr();

        document.getElementById('a10DateInput').value = dateStr;
        document.getElementById('a10WriteDate').textContent = a10FutureTitle(dateStr);
        document.getElementById('a10Content').value = entry ? (entry.content || '') : '';

        // 오늘이 아니면 어느 날짜의 기록인지 안내
        const note = document.getElementById('a10EditingNote');
        note.style.display = isToday ? 'none' : 'block';
        note.textContent = isToday ? '' : `${a10KoreanFull(dateStr)}의 기록입니다.`;

        const btn = document.getElementById('a10SaveBtn');
        btn.classList.remove('saved');
        btn.disabled = false;
        btn.textContent = entry ? '수정 저장' : '저장하기';

        a10RenderRecent();
    }

    // 숫자 포맷 (천단위 콤마 + 소수 자릿수)
    function a10FmtNum(v, digits) {
        if (v == null || isNaN(v)) return '-';
        return Number(v).toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
    }

    // 지표 한 줄 HTML (market 없으면 빈 문자열 → 아무것도 안 보임)
    function a10MarketLine(m) {
        if (!m) return '';
        const parts = [];
        if (m.usdkrw != null) parts.push(`원/달러 <b>${a10FmtNum(m.usdkrw, 2)}</b>`);
        if (m.jpykrw != null) parts.push(`원/엔 <b>${a10FmtNum(m.jpykrw, 2)}</b>`);
        if (m.kospi  != null) parts.push(`코스피 <b>${a10FmtNum(m.kospi, 2)}</b>`);
        if (m.spx    != null) parts.push(`S&amp;P500 <b>${a10FmtNum(m.spx, 2)}</b>`);
        if (m.ndq    != null) parts.push(`나스닥 <b>${a10FmtNum(m.ndq, 2)}</b>`);
        if (m.gold   != null) parts.push(`금 <b>$${a10FmtNum(m.gold, 2)}</b>/oz`);
        if (m.btc    != null) parts.push(`BTC <b>$${a10FmtNum(m.btc, 0)}</b>`);
        if (!parts.length) return '';

        // 기준일 항상 표시. 요청일과 다르면(주말/공휴일 등 직전 거래일) 그 사실도 표기.
        let basis = '';
        if (m.basisDate) {
            const diff = m.stale && m.requestedDate && m.requestedDate !== m.basisDate;
            basis = diff
                ? ` <span class="a10-basis">(요청 ${m.requestedDate} → ${m.basisDate} 기준)</span>`
                : ` <span class="a10-basis">(${m.basisDate} 기준)</span>`;
        }
        const src = m.source ? `출처 ${m.source}${m.v ? ' v' + m.v : ''}${m.basisDate ? ' · 기준일 ' + m.basisDate : ''}` : '';
        return `<div class="a10-market" title="${src}">📊 ${parts.join(' · ')}${basis}</div>`;
    }

    // 쓰기 뷰 하단: 최근 기록 10개 (최신순)
    function a10RenderRecent() {
        const wrap = document.getElementById('a10Recent');
        const countEl = document.getElementById('a10RecentCount');

        if (!a10Entries.length) {
            countEl.textContent = '';
            wrap.innerHTML = '<div class="a10-empty" style="padding:24px 10px;">아직 기록이 없습니다.</div>';
            return;
        }
        const recent = a10Entries.slice()
            .sort((a, b) => a.id < b.id ? 1 : a.id > b.id ? -1 : 0)
            .slice(0, 10);

        countEl.textContent = `(${recent.length}개)`;
        wrap.innerHTML = recent.map(e => `
            <div class="a10-card a10-card-compact${e.id === a10CurrentDate ? ' current' : ''}" onclick="a10EditDate('${e.id}')">
                <div class="a10-card-date">${a10KoreanShort(e.id)}</div>
                <div class="a10-card-sub">${a10FutureSub(e.id)}</div>
                <div class="a10-card-body clamp">${a10Escape(e.content || '')}</div>
                ${a10MarketLine(e.market)}
            </div>`).join('');
    }

    // 경제지표 함수 호출 — 성공/실패를 콘솔에 남기고, 일시 실패는 1회 재시도.
    // 실패하면 null 반환 (지표 없이 저장 진행).
    async function a10FetchMarket(dateStr) {
        const url = `/.netlify/functions/market?date=${dateStr}`;
        for (let attempt = 1; attempt <= 2; attempt++) {
            try {
                const res = await fetch(url);
                console.log(`[After10 지표] 호출 ${attempt}/2 → HTTP ${res.status} (ok=${res.ok})`);
                if (res.ok) {
                    const m = await res.json();
                    if (m && !m.error) {
                        console.log('[After10 지표] 조회 성공 → 저장에 포함:', m);
                        return m;
                    }
                    console.warn('[After10 지표] 응답이 error/빈값 → 지표 없이 저장:', m);
                    return null; // 형식 문제는 재시도해도 동일 → 중단
                }
                console.warn(`[After10 지표] 함수 응답 실패(HTTP ${res.status})` +
                             (attempt < 2 ? ' → 재시도' : ' → 지표 없이 저장'));
            } catch (e) {
                console.warn('[After10 지표] 조회 예외' +
                             (attempt < 2 ? ' → 재시도' : ' → 지표 없이 저장') + ':', e);
            }
        }
        return null;
    }

    // 저장 (setDoc merge — 기존 문서면 createdAt 보존, updatedAt만 갱신)
    async function a10Save() {
        const btn = document.getElementById('a10SaveBtn');
        const content = document.getElementById('a10Content').value;
        const dateStr = a10CurrentDate || todayStr();
        const existing = a10FindEntry(dateStr);
        const now = Date.now();

        const payload = {
            date: dateStr,
            monthDay: dateStr.substring(5),
            content,
            updatedAt: now
        };
        if (!existing) payload.createdAt = now;

        btn.disabled = true;

        // 경제지표: market이 아직 없는 문서에만 조회해 함께 저장 (보존 로직은 market이 이미 있을 때만).
        // 실패해도 일지 저장은 계속 진행 (지표는 부가 정보).
        const needMarket = !existing || !existing.market;
        console.log(`[After10] 저장 시작 ${dateStr} · 지표조회 ${needMarket ? 'O' : 'X (기존 market 유지)'}`);
        if (needMarket) {
            const m = await a10FetchMarket(dateStr);
            if (m) payload.market = m;
        }

        try {
            await setDoc(doc(db, DIARY_COLLECTION, dateStr), payload, { merge: true });
            console.log(`[After10] 저장 완료 ${dateStr} · market 포함 ${!!payload.market}`);
            await a10FetchEntries(); // 저장 후 다시 불러오기
            a10RenderRecent();       // 하단 최근 목록 즉시 반영

            btn.textContent = '✓ 저장되었습니다';
            btn.classList.add('saved');
            setTimeout(() => a10FillWriteForm(a10CurrentDate), 1600);
        } catch (e) {
            console.error('일지 저장 실패:', e);
            btn.textContent = '저장 실패 — 다시 시도해주세요';
            setTimeout(() => a10FillWriteForm(a10CurrentDate), 1600);
        }
    }

    // 뷰2: 전체 타임라인 (날짜 오름차순, 월 바뀔 때 구분선)
    // 타임라인 펼침 상태 (기본: 올해 + 이번 달만 펼침)
    let a10OpenYears = null;
    let a10OpenMonths = null;
    function a10InitTimelineState() {
        if (a10OpenYears) return;
        const t = todayStr();
        a10OpenYears = new Set([t.substring(0, 4)]);
        a10OpenMonths = new Set([t.substring(0, 7)]);
    }
    window.a10ToggleYear = function(y) {
        a10InitTimelineState();
        if (a10OpenYears.has(y)) a10OpenYears.delete(y); else a10OpenYears.add(y);
        a10RenderTimeline();
    };
    window.a10ToggleMonth = function(ym) {
        a10InitTimelineState();
        if (a10OpenMonths.has(ym)) a10OpenMonths.delete(ym); else a10OpenMonths.add(ym);
        a10RenderTimeline();
    };

    function a10RenderTimeline() {
        const wrap = document.getElementById('a10Timeline');
        if (!a10Entries.length) {
            wrap.innerHTML = '<div class="a10-empty">아직 기록이 없습니다.<br>"✍️ 오늘 쓰기"에서 첫 기록을 남겨보세요.</div>';
            return;
        }
        a10InitTimelineState();

        // 최신순 정렬 후 연 → 월로 그룹핑 (Map이 삽입순서 유지 → 연/월도 최신순)
        const sorted = a10Entries.slice().sort((a, b) => a.id < b.id ? 1 : a.id > b.id ? -1 : 0);
        const years = new Map();
        sorted.forEach(e => {
            const y = e.id.substring(0, 4);
            const ym = e.id.substring(0, 7);
            if (!years.has(y)) years.set(y, new Map());
            const months = years.get(y);
            if (!months.has(ym)) months.set(ym, []);
            months.get(ym).push(e);
        });

        let html = '';
        years.forEach((months, y) => {
            const yearCount = [...months.values()].reduce((s, arr) => s + arr.length, 0);
            const yOpen = a10OpenYears.has(y);

            html += `<div class="a10-year-block">
                <div class="a10-year-head${yOpen ? ' open' : ''}" onclick="a10ToggleYear('${y}')">
                    <span class="a10-caret">${yOpen ? '▾' : '▸'}</span>
                    <span class="a10-year-label">${Number(y)}년</span>
                    <span class="a10-cnt">${yearCount}개</span>
                </div>`;

            if (yOpen) {
                html += `<div class="a10-year-body">`;
                months.forEach((list, ym) => {
                    const mOpen = a10OpenMonths.has(ym);
                    html += `<div class="a10-month-block">
                        <div class="a10-month-head${mOpen ? ' open' : ''}" onclick="a10ToggleMonth('${ym}')">
                            <span class="a10-caret">${mOpen ? '▾' : '▸'}</span>
                            <span>${Number(ym.substring(5))}월</span>
                            <span class="a10-cnt">${list.length}개</span>
                        </div>`;
                    if (mOpen) {
                        html += `<div class="a10-month-body">`;
                        list.forEach(e => {
                            html += `
                                <div class="a10-card" onclick="a10EditDate('${e.id}')">
                                    <div class="a10-card-date">${a10KoreanShort(e.id)}</div>
                                    <div class="a10-card-sub">${a10FutureSub(e.id)}</div>
                                    <div class="a10-card-body">${a10Escape(e.content || '')}</div>
                                    ${a10MarketLine(e.market)}
                                </div>`;
                        });
                        html += `</div>`;
                    }
                    html += `</div>`;
                });
                html += `</div>`;
            }
            html += `</div>`;
        });
        wrap.innerHTML = html;
    }

    // 뷰3: 과거의 오늘 (monthDay 일치, 연도 내림차순)
    function a10RenderPast() {
        const wrap = document.getElementById('a10Past');
        const today = todayStr();
        const md = today.substring(5);

        const list = a10Entries
            .filter(e => (e.monthDay || e.id.substring(5)) === md)
            .sort((a, b) => a.id < b.id ? 1 : a.id > b.id ? -1 : 0);

        if (!list.length) {
            wrap.innerHTML = `<div class="a10-empty">${a10KoreanShort(today)}에 남긴 기록이 아직 없습니다.<br>오늘 첫 기록을 남기면 내년부터 여기에 쌓입니다.</div>`;
            return;
        }

        const thisYear = new Date().getFullYear();
        let html = '';
        list.forEach(e => {
            const y = Number(e.id.substring(0, 4));
            const label = (y === thisYear) ? `${y}년 — 오늘` : `${y}년`;
            html += `
                <div class="a10-past-card">
                    <div class="a10-past-year">${label}</div>
                    <div class="a10-card-body">${a10Escape(e.content || '')}</div>
                    ${a10MarketLine(e.market)}
                </div>`;
        });
        if (list.length === 1) {
            html += '<div class="a10-hint">내년 오늘, 이 아래에 기록이 하나 더 쌓입니다.</div>';
        }
        wrap.innerHTML = html;
    }

    /* ===================== 뷰4: 지표 흐름 (차트) =====================
       - a10Entries(탭 진입 시 1회 조회)를 재사용 → 추가 읽기 없음
       - 7종 단위가 달라 한 번에 하나만 그림, 값 없는 날은 건너뜀(0 채우기 X)
    ============================================================== */
    const A10_METRICS = {
        usdkrw: { label: '원/달러',        dec: 2, fmt: v => a10FmtNum(v, 2) },
        jpykrw: { label: '원/엔',          dec: 2, fmt: v => a10FmtNum(v, 2) },
        kospi:  { label: '코스피',         dec: 2, fmt: v => a10FmtNum(v, 2) },
        spx:    { label: 'S&P500',         dec: 2, fmt: v => a10FmtNum(v, 2) },
        ndq:    { label: '나스닥',         dec: 2, fmt: v => a10FmtNum(v, 2) },
        gold:   { label: '금(USD/oz)',     dec: 2, fmt: v => '$' + a10FmtNum(v, 2) },
        btc:    { label: '비트코인(USD)',  dec: 0, fmt: v => '$' + a10FmtNum(v, 0) },
    };
    let a10ChartMetric = 'usdkrw';   // 기본: 원/달러
    let a10ChartMode = 'range';      // 'range' | 'anniv'
    let a10ChartRange = '1m';        // '1m' | '3m' | '1y' | 'all'
    let a10ChartInstance = null;

    window.a10SetChartMetric = function(k) { a10ChartMetric = k; a10RenderChart(); };
    window.a10SetChartMode   = function(m) { a10ChartMode = m; a10RenderChart(); };
    window.a10SetChartRange  = function(r) { a10ChartRange = r; a10RenderChart(); };

    // Date → YYYY-MM-DD (로컬)
    function a10DateToYmd(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // 현재 선택에 맞는 데이터 포인트 목록 (오름차순)
    function a10ChartData() {
        const metric = a10ChartMetric;
        let items = a10Entries
            .filter(e => e.market && e.market[metric] != null)
            .map(e => ({ ymd: e.id, value: e.market[metric] }));

        if (a10ChartMode === 'anniv') {
            const md = todayStr().substring(5);                 // 오늘의 MM-DD
            items = items.filter(e => e.ymd.substring(5) === md);
        } else if (a10ChartRange !== 'all') {
            const days = a10ChartRange === '1m' ? 30 : a10ChartRange === '3m' ? 92 : 365;
            const cut = new Date(); cut.setHours(0, 0, 0, 0); cut.setDate(cut.getDate() - days);
            const cutStr = a10DateToYmd(cut);
            items = items.filter(e => e.ymd >= cutStr);
        }
        items.sort((a, b) => a.ymd < b.ymd ? -1 : a.ymd > b.ymd ? 1 : 0);
        return items;
    }

    // 지표 선택 버튼 렌더 (active 반영)
    function a10BuildMetricBtns() {
        document.getElementById('a10ChartMetrics').innerHTML = Object.keys(A10_METRICS).map(k =>
            `<button class="a10-chip2${k === a10ChartMetric ? ' active' : ''}" onclick="a10SetChartMetric('${k}')">${A10_METRICS[k].label}</button>`
        ).join('');
    }

    function a10RenderChart() {
        // 컨트롤 상태 갱신
        a10BuildMetricBtns();
        document.querySelectorAll('[data-cmode]').forEach(b => b.classList.toggle('active', b.dataset.cmode === a10ChartMode));
        document.querySelectorAll('[data-crange]').forEach(b => b.classList.toggle('active', b.dataset.crange === a10ChartRange));
        document.getElementById('a10ChartRanges').style.display = (a10ChartMode === 'range') ? 'flex' : 'none';

        const msgEl = document.getElementById('a10ChartMsg');
        const statsEl = document.getElementById('a10ChartStats');
        const canvas = document.getElementById('a10Chart');
        const cfg = A10_METRICS[a10ChartMetric];

        if (a10ChartInstance) { a10ChartInstance.destroy(); a10ChartInstance = null; }

        if (typeof Chart === 'undefined') {
            canvas.style.display = 'none'; statsEl.innerHTML = '';
            msgEl.innerHTML = '<div class="a10-empty">차트 라이브러리를 불러오지 못했습니다.<br>네트워크 확인 후 다시 시도해주세요.</div>';
            return;
        }

        const items = a10ChartData();
        if (!items.length) {
            canvas.style.display = 'none'; statsEl.innerHTML = '';
            msgEl.innerHTML = `<div class="a10-empty">표시할 <b>${cfg.label}</b> 데이터가 없습니다.<br>일지를 저장하면 지표가 쌓입니다.</div>`;
            return;
        }
        canvas.style.display = '';

        const fullDates = items.map(e => e.ymd);
        const values = items.map(e => e.value);
        // 라벨: anniv는 연도. range는 MM/DD 기본,
        // 단 앞 점과 연도가 바뀌는 지점만 YYYY/MM/DD로 표기(한 해 안이면 전부 MM/DD).
        const labels = items.map((e, i) => {
            if (a10ChartMode === 'anniv') return e.ymd.substring(0, 4) + '년';
            const mmdd = e.ymd.substring(5).replace('-', '/');
            const yearChanged = i > 0 && e.ymd.substring(0, 4) !== items[i - 1].ymd.substring(0, 4);
            return yearChanged ? `${e.ymd.substring(0, 4)}/${mmdd}` : mmdd;
        });

        a10ChartInstance = new Chart(canvas, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label: cfg.label, data: values,
                    borderColor: '#364fc7', backgroundColor: 'rgba(54,79,199,0.08)',
                    pointBackgroundColor: '#364fc7', pointRadius: 4, pointHoverRadius: 6,
                    tension: 0.25, fill: true,
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            title: ctx => fullDates[ctx[0].dataIndex],
                            label: ctx => `${cfg.label}: ${cfg.fmt(ctx.parsed.y)}`,
                        }
                    }
                },
                scales: {
                    y: { ticks: { callback: v => cfg.fmt(v) } },
                    x: { grid: { display: false } }
                }
            }
        });

        // 최소/최대/변화율
        const min = Math.min(...values), max = Math.max(...values);
        const first = values[0], last = values[values.length - 1];
        let html = `<span>최소 <b>${cfg.fmt(min)}</b></span><span>최대 <b>${cfg.fmt(max)}</b></span>`;
        if (values.length >= 2 && first) {
            const chg = (last - first) / first * 100;
            const cls = chg > 0 ? 'up' : chg < 0 ? 'down' : '';
            html += `<span>변화 <b class="${cls}">${chg > 0 ? '+' : ''}${chg.toFixed(2)}%</b></span>`;
        }
        statsEl.innerHTML = html;

        // 매년 같은 날 모드에서 1개뿐이면 안내
        if (a10ChartMode === 'anniv' && items.length === 1) {
            msgEl.innerHTML = '<div class="a10-hint">아직 한 해치 기록뿐이에요.<br>내년부터 비교가 가능해집니다.</div>';
        } else {
            msgEl.innerHTML = '';
        }
    }

    // 타임라인 항목 클릭 → 해당 날짜를 작성 폼으로
    window.a10EditDate = function(dateStr) {
        a10FillWriteForm(dateStr);
        window.switchAfter10View('write');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    document.getElementById('a10SaveBtn').addEventListener('click', a10Save);
    document.getElementById('a10DateInput').addEventListener('change', (e) => {
        if (e.target.value) a10FillWriteForm(e.target.value);
    });
    document.getElementById('a10TodayPickBtn').addEventListener('click', () => a10FillWriteForm(todayStr()));

    // 초기 상태: ToDo 탭 / 오늘 날짜 표시 (데이터는 탭 진입 시 조회)
    a10FillWriteForm(todayStr());

    /* ===================== 건강 기록 (health) =====================
       기존 tasks/diary와 독립. 컬렉션 "health". 탭 진입 시 1회 조회 후 재사용.
    ============================================================== */
    const HEALTH_COLLECTION = "health";

    // 항목명 정규화 사전 — 병원마다 표기가 달라 여기서 통일 (쉽게 추가)
    const HL_NAME_MAP = {
        'GOT': 'AST(GOT)', 'AST': 'AST(GOT)', 'AST(GOT)': 'AST(GOT)',
        'GPT': 'ALT(GPT)', 'ALT': 'ALT(GPT)', 'ALT(GPT)': 'ALT(GPT)',
        'r-GTP': 'γ-GTP', 'γ-GTP': 'γ-GTP', 'GGT': 'γ-GTP',
        'T-Chol': 'Total Cholesterol', 'Total Cholesterol': 'Total Cholesterol', '총콜레스테롤': 'Total Cholesterol',
        'TG': 'Triglyceride', '중성지방': 'Triglyceride',
        'FBS': 'Glucose', 'Glucose': 'Glucose', '공복혈당': 'Glucose',
        'HbA1c': 'HbA1c', '당화혈색소': 'HbA1c',
        'Hb': 'Hemoglobin', 'Hemoglobin': 'Hemoglobin', '혈색소': 'Hemoglobin',
    };
    // 병원명 힌트 (텍스트에 있으면 우선 사용). 없으면 '병원/의원/센터' 휴리스틱.
    const HL_HOSPITALS = ['서울성모병원', '삼성서울병원', '서울아산병원', '세브란스병원', '분당서울대병원'];

    let hlRecords = [];
    let hlPerson = '짱구';
    let hlView = 'input';
    let hlType = 'blood';
    let hlEditId = null;
    let hlChartInstance = null;

    // ---------- 파싱 유틸 ----------
    const hlPad = n => String(n).padStart(2, '0');
    const hlNum = s => { const v = parseFloat(String(s).replace(/,/g, '')); return isNaN(v) ? null : v; };
    function hlNormalizeName(name) {
        const key = name.replace(/\s+/g, ' ').trim();
        return HL_NAME_MAP[key] || HL_NAME_MAP[key.replace(/\s+/g, '')] || key;
    }
    // 결과값: "105▲" → {value:105, abnormal:true, raw}. "6.6 미만" → value 6.6. 숫자 없으면 value null.
    function hlParseResult(raw) {
        raw = (raw || '').trim();
        const abnormal = /[▲▼↑↓]/.test(raw) || /[HL]$/.test(raw.replace(/\s/g, '')) && /\d/.test(raw);
        const m = raw.replace(/,/g, '').match(/-?\d+(?:\.\d+)?/);
        return { value: m ? parseFloat(m[0]) : null, raw, abnormal: /[▲▼↑↓]/.test(raw) };
    }
    // 참고치: "70 ~ 99 mg/dl" → {refLow:70, refHigh:99, unit:'mg/dl'}. "<200 mg/dl","13.8 미만 IU/mL","ml/min/1.73㎡"(단위만) 처리.
    function hlParseRef(raw) {
        let s = (raw || '').trim();
        let refLow = null, refHigh = null, unit = '', m;
        if ((m = s.match(/^([\d.,]+)\s*[~〜～\-–]\s*([\d.,]+)\s*(.*)$/))) { refLow = hlNum(m[1]); refHigh = hlNum(m[2]); unit = m[3]; }
        else if ((m = s.match(/^[<＜]\s*([\d.,]+)\s*(.*)$/))) { refHigh = hlNum(m[1]); unit = m[2]; }
        else if ((m = s.match(/^[>＞]\s*([\d.,]+)\s*(.*)$/))) { refLow = hlNum(m[1]); unit = m[2]; }
        else if ((m = s.match(/^([\d.,]+)\s*(?:미만|이하)\s*(.*)$/))) { refHigh = hlNum(m[1]); unit = m[2]; }
        else if ((m = s.match(/^([\d.,]+)\s*(?:초과|이상)\s*(.*)$/))) { refLow = hlNum(m[1]); unit = m[2]; }
        else { unit = s; }  // 참고치 없이 단위만 (예: ml/min/1.73㎡) 또는 빈값
        return { refLow, refHigh, unit: unit.trim() };
    }
    function hlIsPersonalInfo(t) {
        const c = t.replace(/\s/g, '');
        return /(성명|이름|환자명|생년월일|주민등록|등록번호|차트번호|수진자|나이|성별|병록번호)/.test(c);
    }
    function hlIsHeaderOrNote(t) {
        const c = t.replace(/\s/g, '');
        if (/^(검사항목|결과|참고치|참고범위|검사자|확인자|접수일자|보고일시|단위|검사명|판정|정상범위|비고)$/.test(c)) return true;
        // 처방/보고 등 메타 라인
        if (/^(처방일자|보고일자|접수번호|검체|채취일)/.test(c)) return true;
        return false;
    }
    // 첫 컬럼이 헤더 단어인 행(여러 컬럼이 붙은 헤더 행) 판별
    function hlIsHeaderCol(s) {
        const c = (s || '').replace(/\s/g, '');
        return /^(검사항목|검사명|항목|결과|참고치|참고범위|참고|검사자|확인자|접수일자|보고일시|단위|판정|정상범위|비고)$/.test(c);
    }
    function hlLooksLikeItemName(s) {
        if (!/[A-Za-z가-힣]/.test(s)) return false;      // 글자 없음(숫자·날짜) → 아님
        if (/^\d{4}[-.\/]\d{1,2}/.test(s)) return false;  // 날짜
        if (s.length > 40) return false;
        return true;
    }

    // ★ 혈액검사 파서 — 규칙은 여기 한 곳에 모아 확장 (병원별 보정 용이)
    function hlParseBloodTest(text) {
        const lines = (text || '').split(/\r?\n/);
        let date = '', hospital = '';
        const items = [];
        let dropped = 0;

        // 날짜: 채취일시/채취일자 우선 (처방일자 아님)
        const dm = text.match(/채취일[시자][^\d]*(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
        if (dm) date = `${dm[1]}-${hlPad(dm[2])}-${hlPad(dm[3])}`;

        // 병원
        for (const h of HL_HOSPITALS) { if (text.includes(h)) { hospital = h; break; } }
        if (!hospital) { const hm = text.match(/([가-힣A-Za-z]{2,}(?:대학교병원|병원|의원|클리닉|검진센터|센터|의료원))/); if (hm) hospital = hm[1]; }

        for (const line of lines) {
            const t = line.trim();
            if (!t) continue;
            if (hlIsPersonalInfo(t) || hlIsHeaderOrNote(t)) continue;
            // 컬럼 분리: 탭 또는 2칸 이상 공백 (항목명/결과/참고치/검사자/확인자/접수일자/보고일시)
            const cols = t.split(/\t+| {2,}/).map(c => c.trim()).filter(Boolean);
            if (cols.length < 2) continue;               // 항목+결과 최소
            if (hlIsHeaderCol(cols[0])) continue;        // 여러 컬럼이 붙은 헤더 행 제외
            if (!hlLooksLikeItemName(cols[0])) { dropped++; continue; }
            const res = hlParseResult(cols[1]);
            const ref = cols[2] ? hlParseRef(cols[2]) : { refLow: null, refHigh: null, unit: '' };
            const abnormal = (res.value != null && (ref.refLow != null || ref.refHigh != null))
                ? (ref.refLow != null && res.value < ref.refLow) || (ref.refHigh != null && res.value > ref.refHigh)
                : res.abnormal;
            items.push({
                name: hlNormalizeName(cols[0]), value: res.value, raw: res.raw,
                unit: ref.unit || '', refLow: ref.refLow, refHigh: ref.refHigh,
                refText: cols[2] || '', abnormal, parseFailed: res.value == null,
            });
        }
        return { date, hospital, items, dropped };
    }

    // ---------- 조회/전환 ----------
    async function hlFetch() {
        const snap = await getDocs(collection(db, HEALTH_COLLECTION));
        hlRecords = [];
        snap.forEach(d => hlRecords.push({ id: d.id, ...d.data() }));
    }
    async function hlLoad() {
        try { await hlFetch(); hlRefreshView(); }
        catch (e) { console.error('건강기록 조회 실패:', e); }
    }
    function hlRefreshView() {
        if (hlView === 'list') hlRenderList();
        if (hlView === 'chart') hlRenderChart();
    }

    window.hlSetPerson = function(p) {
        hlPerson = p;
        document.querySelectorAll('[data-person]').forEach(b => b.classList.toggle('active', b.dataset.person === p));
        hlRefreshView();
    };
    window.hlSetView = function(v) {
        hlView = v;
        const map = { input: 'hlViewInput', list: 'hlViewList', chart: 'hlViewChart' };
        Object.keys(map).forEach(k => document.getElementById(map[k]).style.display = (k === v) ? 'block' : 'none');
        document.querySelectorAll('[data-hview]').forEach(b => b.classList.toggle('active', b.dataset.hview === v));
        hlRefreshView();
    };
    window.hlSetType = function(tp) {
        hlType = tp;
        document.querySelectorAll('[data-htype]').forEach(b => b.classList.toggle('active', b.dataset.htype === tp));
        document.getElementById('hlBloodInput').style.display = (tp === 'blood') ? 'block' : 'none';
        document.getElementById('hlNoteInput').style.display = (tp === 'blood') ? 'none' : 'block';
    };

    // ---------- 입력: 편집 표 ----------
    function hlItemRowHtml(it) {
        const cls = it.parseFailed ? 'failed' : (it.abnormal ? 'abnormal' : '');
        const val = it.value != null ? it.value : (it.raw || '');
        const esc = s => String(s == null ? '' : s).replace(/"/g, '&quot;').replace(/</g, '&lt;');
        return `<tr class="${cls}">
            <td><input class="hl-i-name" value="${esc(it.name)}"></td>
            <td><input class="hl-i-val" value="${esc(val)}" data-raw="${esc(it.raw || '')}"></td>
            <td><input class="hl-i-unit" value="${esc(it.unit)}"></td>
            <td><input class="hl-i-ref" value="${esc(it.refText)}"></td>
            <td class="hl-del" onclick="hlDeleteRow(this)">✕</td>
        </tr>`;
    }
    function hlRenderItemsTable(items) {
        const wrap = document.getElementById('hlItemsWrap');
        if (!items || !items.length) { wrap.innerHTML = ''; return; }
        wrap.innerHTML = `
            <table class="hl-items-table">
                <thead><tr>
                    <th class="hl-col-name">항목명</th><th class="hl-col-val">값</th>
                    <th class="hl-col-unit">단위</th><th class="hl-col-ref">참고치</th><th class="hl-col-x"></th>
                </tr></thead>
                <tbody id="hlItemsBody">${items.map(hlItemRowHtml).join('')}</tbody>
            </table>
            <div class="hl-btnrow"><button type="button" class="hl-addrow-btn" onclick="hlAddRow()">+ 행 추가</button></div>`;
    }
    window.hlAddRow = function() {
        const body = document.getElementById('hlItemsBody');
        if (!body) { hlRenderItemsTable([{ name: '', value: null, raw: '', unit: '', refText: '', abnormal: false, parseFailed: false }]); return; }
        body.insertAdjacentHTML('beforeend', hlItemRowHtml({ name: '', value: null, raw: '', unit: '', refText: '', abnormal: false, parseFailed: false }));
    };
    window.hlDeleteRow = function(td) { td.closest('tr').remove(); };

    // 표 → items 배열 (저장 시 재구성: 값 재파싱 + abnormal 재계산)
    function hlRowsToItems() {
        const rows = document.querySelectorAll('#hlItemsBody tr');
        const items = [];
        rows.forEach(tr => {
            const name = tr.querySelector('.hl-i-name').value.trim();
            const valInput = tr.querySelector('.hl-i-val');
            const valStr = valInput.value.trim();
            const unit = tr.querySelector('.hl-i-unit').value.trim();
            const refText = tr.querySelector('.hl-i-ref').value.trim();
            if (!name && !valStr) return;                 // 빈 행 무시
            const res = hlParseResult(valStr);
            const ref = hlParseRef(refText);
            const abnormal = (res.value != null && (ref.refLow != null || ref.refHigh != null))
                ? (ref.refLow != null && res.value < ref.refLow) || (ref.refHigh != null && res.value > ref.refHigh)
                : res.abnormal;
            items.push({
                name, value: res.value, raw: valStr,
                unit: unit || ref.unit || '', refLow: ref.refLow, refHigh: ref.refHigh,
                refText, abnormal, parseFailed: res.value == null,
            });
        });
        return items;
    }

    document.getElementById('hlParseBtn').addEventListener('click', () => {
        const text = document.getElementById('hlPaste').value;
        const r = hlParseBloodTest(text);
        if (r.date && !document.getElementById('hlDate').value) document.getElementById('hlDate').value = r.date;
        if (r.hospital && !document.getElementById('hlHospital').value) document.getElementById('hlHospital').value = r.hospital;
        hlRenderItemsTable(r.items);
        const failed = r.items.filter(i => i.parseFailed).length;
        document.getElementById('hlParseInfo').innerHTML =
            `인식 ${r.items.length}개 항목` +
            (failed ? ` · <span style="color:#f59f00;">숫자 인식 실패 ${failed}개(노란 행)</span>` : '') +
            (r.date ? ` · 채취일 ${r.date}` : '') +
            (r.hospital ? ` · ${r.hospital}` : '') +
            ` — 아래 표에서 확인·수정 후 저장하세요.`;
    });

    // ---------- 저장/수정/삭제 ----------
    function hlMsg(text, ok) {
        const el = document.getElementById('hlSaveMsg');
        el.textContent = text; el.style.color = ok ? '#40c057' : '#e03131';
        if (ok) setTimeout(() => { el.textContent = ''; }, 2000);
    }
    async function hlSave() {
        const date = document.getElementById('hlDate').value;
        if (!date) return hlMsg('날짜를 입력해주세요.');
        const hospital = document.getElementById('hlHospital').value.trim();
        const now = Date.now();
        const data = { person: hlPerson, type: hlType, date, hospital, updatedAt: now };
        if (hlType === 'blood') { data.items = hlRowsToItems(); data.note = ''; }
        else { data.items = []; data.note = document.getElementById('hlNote').value; }

        const btn = document.getElementById('hlSaveBtn');
        btn.disabled = true;
        try {
            if (hlEditId) await updateDoc(doc(db, HEALTH_COLLECTION, hlEditId), data);
            else { data.createdAt = now; await addDoc(collection(db, HEALTH_COLLECTION), data); }
            await hlFetch();
            hlResetInput();
            hlMsg('✓ 저장되었습니다', true);
        } catch (e) { console.error('건강기록 저장 실패:', e); hlMsg('저장 실패 — 다시 시도해주세요'); }
        finally { btn.disabled = false; }
    }
    function hlResetInput() {
        hlEditId = null;
        document.getElementById('hlDate').value = '';
        document.getElementById('hlHospital').value = '';
        document.getElementById('hlPaste').value = '';
        document.getElementById('hlNote').value = '';
        document.getElementById('hlItemsWrap').innerHTML = '';
        document.getElementById('hlParseInfo').innerHTML = '';
        document.getElementById('hlCancelEdit').style.display = 'none';
        document.getElementById('hlSaveBtn').textContent = '저장';
        hlSetType('blood');
    }
    document.getElementById('hlSaveBtn').addEventListener('click', hlSave);
    document.getElementById('hlCancelEdit').addEventListener('click', hlResetInput);

    window.hlEdit = function(id) {
        const r = hlRecords.find(x => x.id === id);
        if (!r) return;
        hlEditId = id;
        hlPerson = r.person; hlSetPerson(r.person);
        hlSetType(r.type || 'blood');
        document.getElementById('hlDate').value = r.date || '';
        document.getElementById('hlHospital').value = r.hospital || '';
        if ((r.type || 'blood') === 'blood') { hlRenderItemsTable(r.items || []); document.getElementById('hlParseInfo').innerHTML = '수정 중 — 표를 고치고 저장하세요.'; }
        else { document.getElementById('hlNote').value = r.note || ''; }
        document.getElementById('hlSaveBtn').textContent = '수정 저장';
        document.getElementById('hlCancelEdit').style.display = 'block';
        hlSetView('input');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    window.hlDelete = async function(id) {
        if (!confirm('이 기록을 삭제할까요?')) return;
        try { await deleteDoc(doc(db, HEALTH_COLLECTION, id)); await hlFetch(); hlRenderList(); }
        catch (e) { console.error('삭제 실패:', e); }
    };
    window.hlToggleRec = function(id) {
        const el = document.getElementById('hlbody-' + id);
        if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    };

    // ---------- 기록 목록 ----------
    const HL_TYPE_LABEL = { blood: '혈액', endoscopy: '내시경', other: '기타' };
    function hlEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function hlRenderList() {
        const wrap = document.getElementById('hlList');
        const recs = hlRecords.filter(r => r.person === hlPerson)
            .sort((a, b) => (a.date || '') < (b.date || '') ? 1 : (a.date || '') > (b.date || '') ? -1 : 0);
        if (!recs.length) { wrap.innerHTML = `<div class="a10-empty">${hlPerson}의 건강기록이 없습니다.<br>“기록 입력”에서 추가하세요.</div>`; return; }
        wrap.innerHTML = recs.map(r => {
            const type = r.type || 'blood';
            const abn = (r.items || []).filter(i => i.abnormal).length;
            let body = '';
            if (type === 'blood') {
                const rows = (r.items || []).map(i => `<tr class="${i.abnormal ? 'abnormal' : ''}">
                    <td>${hlEsc(i.name)}</td>
                    <td class="hl-v">${hlEsc(i.value != null ? i.value : i.raw)}${i.abnormal ? ' <span class="hl-abn-mark">▲▼</span>' : ''}</td>
                    <td>${hlEsc(i.unit)}</td><td>${hlEsc(i.refText)}</td></tr>`).join('');
                body = `<div class="hl-rec-body" id="hlbody-${r.id}" style="display:none">
                    <table class="hl-view-table"><thead><tr><th>항목</th><th>값</th><th>단위</th><th>참고치</th></tr></thead><tbody>${rows}</tbody></table></div>`;
            } else {
                body = `<div class="hl-rec-body" id="hlbody-${r.id}" style="display:none"><div class="hl-rec-note">${hlEsc(r.note)}</div></div>`;
            }
            return `<div class="hl-rec">
                <div class="hl-rec-head" onclick="hlToggleRec('${r.id}')">
                    <span class="hl-rec-date">${hlEsc(r.date)}</span>
                    <span class="hl-rec-badge hl-badge-${type}">${HL_TYPE_LABEL[type] || type}</span>
                    ${r.hospital ? `<span class="hl-rec-hosp">${hlEsc(r.hospital)}</span>` : ''}
                    ${abn ? `<span class="hl-rec-ab">이상 ${abn}</span>` : ''}
                </div>
                ${body}
                <div class="hl-rec-actions">
                    <button class="hl-mini-btn hl-mini-edit" onclick="hlEdit('${r.id}')">수정</button>
                    <button class="hl-mini-btn hl-mini-del" onclick="hlDelete('${r.id}')">삭제</button>
                </div>
            </div>`;
        }).join('');
    }

    // ---------- 수치 흐름 (Chart.js 재사용) ----------
    function hlBloodItemNames(person) {
        const set = new Set();
        hlRecords.filter(r => r.person === person && (r.type || 'blood') === 'blood')
            .forEach(r => (r.items || []).forEach(i => { if (i.value != null && i.name) set.add(i.name); }));
        return [...set].sort();
    }
    function hlRenderChart() {
        const sel = document.getElementById('hlChartItem');
        const names = hlBloodItemNames(hlPerson);
        const prev = sel.value;
        sel.innerHTML = names.map(n => `<option>${hlEsc(n)}</option>`).join('');
        if (names.includes(prev)) sel.value = prev;

        const canvas = document.getElementById('hlChart');
        const statsEl = document.getElementById('hlChartStats');
        const msgEl = document.getElementById('hlChartMsg');
        if (hlChartInstance) { hlChartInstance.destroy(); hlChartInstance = null; }

        if (typeof Chart === 'undefined') { canvas.style.display = 'none'; statsEl.innerHTML = ''; msgEl.innerHTML = '<div class="a10-empty">차트 라이브러리를 불러오지 못했습니다.</div>'; return; }
        if (!names.length) { canvas.style.display = 'none'; statsEl.innerHTML = ''; sel.style.display = 'none'; msgEl.innerHTML = `<div class="a10-empty">${hlPerson}의 혈액검사 수치가 없습니다.</div>`; return; }
        sel.style.display = '';

        const itemName = sel.value;
        const pts = []; let refLow = null, refHigh = null, unit = '';
        hlRecords.filter(r => r.person === hlPerson && (r.type || 'blood') === 'blood')
            .forEach(r => { const it = (r.items || []).find(x => x.name === itemName); if (it && it.value != null) { pts.push({ date: r.date, value: it.value }); if (it.refLow != null) refLow = it.refLow; if (it.refHigh != null) refHigh = it.refHigh; if (it.unit) unit = it.unit; } });
        pts.sort((a, b) => (a.date || '') < (b.date || '') ? -1 : 1);

        if (!pts.length) { canvas.style.display = 'none'; statsEl.innerHTML = ''; msgEl.innerHTML = '<div class="a10-empty">이 항목의 수치가 없습니다.</div>'; return; }
        canvas.style.display = '';

        const labels = pts.map(p => (p.date || '').substring(2).replace(/-/g, '/'));
        const values = pts.map(p => p.value);
        const datasets = [];
        // 참고치 배경 영역 (상·하한 둘 다 있을 때 밴드, 하나면 점선)
        if (refLow != null && refHigh != null) {
            datasets.push({ label: '상한', data: values.map(() => refHigh), borderColor: 'rgba(12,166,120,0.45)', borderDash: [4, 4], pointRadius: 0, fill: '+1', backgroundColor: 'rgba(12,166,120,0.10)' });
            datasets.push({ label: '하한', data: values.map(() => refLow), borderColor: 'rgba(12,166,120,0.45)', borderDash: [4, 4], pointRadius: 0, fill: false });
        } else if (refHigh != null) {
            datasets.push({ label: '상한', data: values.map(() => refHigh), borderColor: 'rgba(12,166,120,0.45)', borderDash: [4, 4], pointRadius: 0, fill: false });
        } else if (refLow != null) {
            datasets.push({ label: '하한', data: values.map(() => refLow), borderColor: 'rgba(12,166,120,0.45)', borderDash: [4, 4], pointRadius: 0, fill: false });
        }
        const valueDsIndex = datasets.length;
        datasets.push({
            label: itemName, data: values, borderColor: '#364fc7', backgroundColor: 'rgba(54,79,199,0.06)',
            pointBackgroundColor: pts.map(p => ((refLow != null && p.value < refLow) || (refHigh != null && p.value > refHigh)) ? '#e03131' : '#364fc7'),
            pointRadius: 4, pointHoverRadius: 6, tension: 0.2, fill: false,
        });

        hlChartInstance = new Chart(canvas, {
            type: 'line',
            data: { labels, datasets },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: { filter: c => c.datasetIndex === valueDsIndex, callbacks: { title: c => pts[c[0].dataIndex].date, label: c => `${itemName}: ${c.parsed.y}${unit ? ' ' + unit : ''}` } }
                },
                scales: { x: { grid: { display: false } } }
            }
        });

        const mn = Math.min(...values), mx = Math.max(...values), first = values[0], last = values[values.length - 1];
        let html = `<span>최소 <b>${mn}</b></span><span>최대 <b>${mx}</b></span>`;
        if (values.length >= 2 && first) { const chg = (last - first) / first * 100; html += `<span>변화 <b class="${chg > 0 ? 'up' : chg < 0 ? 'down' : ''}">${chg > 0 ? '+' : ''}${chg.toFixed(1)}%</b></span>`; }
        if (refLow != null || refHigh != null) html += `<span class="hl-ref">참고 ${refLow != null ? refLow : ''}~${refHigh != null ? refHigh : ''}${unit ? ' ' + unit : ''}</span>`;
        statsEl.innerHTML = html;
        msgEl.innerHTML = values.length === 1 ? '<div class="a10-hint">기록이 1건이라 흐름은 다음 기록부터 보입니다.</div>' : '';
    }
    window.hlRenderChart = hlRenderChart;

    /* ===================== 로그인 게이트 =====================
       - 로그인 전: #loginScreen 만 표시, 메인(.container) 숨김
       - 로그인 후: 메인 표시 + startTodoData()로 tasks 구독 시작
       - After10 diary 조회는 탭 클릭 시(a10LoadEntries)라 이미 로그인 이후에만 실행됨
    ========================================================== */
    const auth = getAuth(app);

    const loginScreenEl = document.getElementById('loginScreen');
    const containerEl   = document.querySelector('.container');
    const logoutBtnEl   = document.getElementById('logoutBtn');
    const loginEmailEl  = document.getElementById('loginEmail');
    const loginPwEl     = document.getElementById('loginPassword');
    const loginBtnEl    = document.getElementById('loginBtn');
    const loginErrorEl  = document.getElementById('loginError');

    function showLoginError(msg) {
        loginErrorEl.textContent = msg;
        loginErrorEl.style.display = 'block';
    }

    async function doLogin() {
        const email = loginEmailEl.value.trim();
        const pw = loginPwEl.value;
        loginErrorEl.style.display = 'none';
        if (!email || !pw) {
            showLoginError('이메일과 비밀번호를 입력해주세요.');
            return;
        }
        loginBtnEl.disabled = true;
        loginBtnEl.textContent = '로그인 중...';
        try {
            await signInWithEmailAndPassword(auth, email, pw);
            // 성공 시 onAuthStateChanged가 화면 전환/데이터 로딩 처리
        } catch (e) {
            showLoginError('로그인에 실패했습니다. 이메일과 비밀번호를 확인해주세요.');
            loginBtnEl.disabled = false;
            loginBtnEl.textContent = '로그인';
        }
    }

    loginBtnEl.addEventListener('click', doLogin);
    loginEmailEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginPwEl.focus(); });
    loginPwEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    logoutBtnEl.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
        if (user) {
            // 로그인됨 → 메인 표시 후 데이터 로딩 시작
            loginScreenEl.style.display = 'none';
            containerEl.style.display = 'block';
            logoutBtnEl.style.display = 'block';
            startTodoData();
        } else {
            // 로그인 안 됨 → 구독 해제 후 로그인 화면만
            stopTodoData();
            containerEl.style.display = 'none';
            logoutBtnEl.style.display = 'none';
            loginScreenEl.style.display = 'flex';
            loginErrorEl.style.display = 'none';
            loginPwEl.value = '';
            loginBtnEl.disabled = false;
            loginBtnEl.textContent = '로그인';
        }
    });
</script>

</body>
</html>
