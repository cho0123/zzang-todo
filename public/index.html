    let hlChartMode = 'single'; // 'single'(개별) | 'group'(묶음)
    let hlGroupKey = 'thyroid'; // 선택된 묶음 키
    let hlGroupCharts = [];     // 묶음 보기의 작은 차트 인스턴스들 (정리용)

    // 묶음 정의 — 항목명은 정규화된 이름(canonical) 기준. 여기만 고치면 묶음이 바뀐다.
    const HL_GROUPS = {
        thyroid: { label: '갑상선', items: ['TSH', 'Free T4', 'Free T3', 'TSH Receptor Ab (TSI/TBII)'] },
        metabolic: { label: '당·지질', items: ['Glucose', 'HbA1c', 'Total Cholesterol', 'Triglycerides', 'HDL-Cholesterol', 'LDL-Cholesterol'] },
        liver: { label: '간', items: ['AST(GOT)', 'ALT(GPT)', 'γ-GTP'] },
    };

    // ---------- 파싱 유틸 ----------
    const hlPad = n => String(n).padStart(2, '0');
    const hlNum = s => { const v = parseFloat(String(s).replace(/,/g, '')); return isNaN(v) ? null : v; };
    // 표시용 이름. 사전에 없으면 원본을 공백만 정리해 그대로 돌려준다.
    function hlNormalizeName(name) {
        const raw = String(name == null ? '' : name).replace(/\s+/g, ' ').trim();
        return HL_NAME_LOOKUP.get(hlNameKey(raw)) || raw;
    }
    // 결과값: "105▲" → {value:105, abnormal:true, raw}. "6.6 미만" → value 6.6. 숫자 없으면 value null.
    function hlParseResult(raw) {
        raw = (raw || '').trim();
        const abnormal = /[▲▼↑↓]/.test(raw) || /[HL]$/.test(raw.replace(/\s/g, '')) && /\d/.test(raw);
        const m = raw.replace(/,/g, '').match(/-?\d+(?:\.\d+)?/);
        return { value: m ? parseFloat(m[0]) : null, raw, abnormal: /[▲▼↑↓]/.test(raw) };
    }
    // 참고치 문자열에서 단위만 남긴다.
    // 결과지 컬럼이 어긋나 숫자가 앞 칸으로 빠지면 "미만 mg/dL" 처럼 비교어만 남는 경우가 있다.
    // 앞뒤에 붙은 숫자·부등호·한글 비교어를 걷어내 단위 칸이 오염되지 않게 한다.
    // ※ 단위 자체가 숫자로 시작하는 표기(예: "10^3/µL")는 건드리지 않도록,
    //    숫자 뒤에 공백이 있거나 문자열이 끝날 때만 숫자를 제거한다.
    function hlCleanUnit(raw) {
        let u = String(raw == null ? '' : raw).trim();
        let prev;
        do {
            prev = u;
            u = u.replace(/^[\s~〜～\-–<>＜＞=≤≥]+/, '')          // 앞쪽 부등호·물결
                 .replace(/^[\d.,]+(?=\s|$)/, '')                  // 앞쪽 숫자 (뒤에 공백/끝일 때만)
                 .replace(/^(?:미만|이하|초과|이상|이내|사이)/, '')  // 앞쪽 한글 비교어
                 .trim();
        } while (u !== prev);
        return u.replace(/(?:\s*(?:미만|이하|초과|이상|이내|사이))+$/, '').trim();
    }
    // 참고치: "70 ~ 99 mg/dl" → {refLow:70, refHigh:99, unit:'mg/dl'}.
    //   "<200 mg/dl", "13.8 미만 IU/mL", "60 이상 mL/min/1.73 m2", "ml/min/1.73㎡"(단위만) 처리.
    //   "0.0 %" 처럼 숫자 하나뿐이면 상·하한을 만들지 않고 단위만 취한다(원문은 refText에 남는다).
    function hlParseRef(raw) {
        let s = (raw || '').trim();
        let refLow = null, refHigh = null, unit = '', m;
        if ((m = s.match(/^([\d.,]+)\s*[~〜～\-–]\s*([\d.,]+)\s*(.*)$/))) { refLow = hlNum(m[1]); refHigh = hlNum(m[2]); unit = m[3]; }
        else if ((m = s.match(/^[<＜]\s*([\d.,]+)\s*(.*)$/))) { refHigh = hlNum(m[1]); unit = m[2]; }
        else if ((m = s.match(/^[>＞]\s*([\d.,]+)\s*(.*)$/))) { refLow = hlNum(m[1]); unit = m[2]; }
        else if ((m = s.match(/^([\d.,]+)\s*(?:미만|이하)\s*(.*)$/))) { refHigh = hlNum(m[1]); unit = m[2]; }
        else if ((m = s.match(/^([\d.,]+)\s*(?:초과|이상)\s*(.*)$/))) { refLow = hlNum(m[1]); unit = m[2]; }
        else if ((m = s.match(/^[\d.,]+(?:\s+(.*))?$/))) { unit = m[1] || ''; }  // 숫자 하나뿐 — 상·하한 불명이라 만들지 않는다
        else { unit = s; }  // 참고치 없이 단위만 (예: ml/min/1.73㎡) 또는 빈값
        return { refLow, refHigh, unit: hlCleanUnit(unit) };
    }
    function hlIsPersonalInfo(t) {
        const c = t.replace(/\s/g, '');
        return /(성명|이름|환자명|생년월일|주민등록|등록번호|차트번호|수진자|나이|성별|병록번호)/.test(c);
    }
    function hlIsHeaderOrNote(t) {
        const c = t.replace(/\s/g, '');
        if (/^(검사항목|결과|참고치|참고범위|검사자|확인자|접수일자|보고일시|단위|검사명|판정|정상범위|비고)$/.test(c)) return true;
        // 처방/보고 등 메타 라인
        if (/^(처방일자|보고일자|접수번호|검체|채취일)/.test(c)) return true;
        return false;
    }
    // 첫 컬럼이 헤더 단어인 행(여러 컬럼이 붙은 헤더 행) 판별
    function hlIsHeaderCol(s) {
        const c = (s || '').replace(/\s/g, '');
        return /^(검사항목|검사명|항목|결과|참고치|참고범위|참고|검사자|확인자|접수일자|보고일시|단위|판정|정상범위|비고)$/.test(c);
    }
    function hlLooksLikeItemName(s) {
        if (!/[A-Za-z가-힣]/.test(s)) return false;      // 글자 없음(숫자·날짜) → 아님
        if (/^\d{4}[-.\/]\d{1,2}/.test(s)) return false;  // 날짜
        if (s.length > 40) return false;
        return true;
    }

    // ★ 혈액검사 파서 — 규칙은 여기 한 곳에 모아 확장 (병원별 보정 용이)
    function hlParseBloodTest(text) {
        const lines = (text || '').split(/\r?\n/);
        let date = '', hospital = '';
        const items = [];
        let dropped = 0;

        // 날짜: 채취일시/채취일자 우선 (처방일자 아님)
        const dm = text.match(/채취일[시자][^\d]*(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
        if (dm) date = `${dm[1]}-${hlPad(dm[2])}-${hlPad(dm[3])}`;

        // 병원
        for (const h of HL_HOSPITALS) { if (text.includes(h)) { hospital = h; break; } }
        if (!hospital) { const hm = text.match(/([가-힣A-Za-z]{2,}(?:대학교병원|병원|의원|클리닉|검진센터|센터|의료원))/); if (hm) hospital = hm[1]; }

        for (const line of lines) {
            const t = line.trim();
            if (!t) continue;
            if (hlIsPersonalInfo(t) || hlIsHeaderOrNote(t)) continue;
            // 컬럼 분리: 탭 또는 2칸 이상 공백 (항목명/결과/참고치/검사자/확인자/접수일자/보고일시)
            const cols = t.split(/\t+| {2,}/).map(c => c.trim()).filter(Boolean);
            if (cols.length < 2) continue;               // 항목+결과 최소
            if (hlIsHeaderCol(cols[0])) continue;        // 여러 컬럼이 붙은 헤더 행 제외
            if (!hlLooksLikeItemName(cols[0])) { dropped++; continue; }
            const res = hlParseResult(cols[1]);
            const ref = cols[2] ? hlParseRef(cols[2]) : { refLow: null, refHigh: null, unit: '' };
            const abnormal = (res.value != null && (ref.refLow != null || ref.refHigh != null))
                ? (ref.refLow != null && res.value < ref.refLow) || (ref.refHigh != null && res.value > ref.refHigh)
                : res.abnormal;
            items.push({
                name: cols[0].replace(/\s+/g, ' ').trim(), value: res.value, raw: res.raw,  // 결과지 원본 보존 — 정규화는 표시할 때만
                unit: ref.unit || '', refLow: ref.refLow, refHigh: ref.refHigh,
                refText: cols[2] || '', abnormal, parseFailed: res.value == null,
            });
        }
        return { date, hospital, items, dropped };
    }

    // ---------- 조회/전환 ----------
    async function hlFetch() {
        const snap = await getDocs(collection(db, HEALTH_COLLECTION));
        hlRecords = [];
        snap.forEach(d => hlRecords.push({ id: d.id, ...d.data() }));
    }
    async function hlLoad() {
        try { await hlFetch(); hlRefreshView(); }
        catch (e) { console.error('건강기록 조회 실패:', e); }
    }
    function hlRefreshView() {
        if (hlView === 'list') hlRenderList();
        if (hlView === 'chart') hlRenderChart();
    }

    window.hlSetPerson = function(p) {
        hlPerson = p;
        document.querySelectorAll('[data-person]').forEach(b => b.classList.toggle('active', b.dataset.person === p));
        hlRefreshView();
    };
    window.hlSetView = function(v) {
        hlView = v;
        // 차트 뷰를 떠날 때는 차트 인스턴스를 정리한다(메모리 누수·잔상 방지)
        if (v !== 'chart') {
            if (hlChartInstance) { hlChartInstance.destroy(); hlChartInstance = null; }
            hlDestroyGroupCharts();
        }
        const map = { input: 'hlViewInput', list: 'hlViewList', chart: 'hlViewChart' };
        Object.keys(map).forEach(k => document.getElementById(map[k]).style.display = (k === v) ? 'block' : 'none');
        document.querySelectorAll('[data-hview]').forEach(b => b.classList.toggle('active', b.dataset.hview === v));
        hlRefreshView();
    };
    window.hlSetType = function(tp) {
        hlType = tp;
        document.querySelectorAll('[data-htype]').forEach(b => b.classList.toggle('active', b.dataset.htype === tp));
        document.getElementById('hlBloodInput').style.display = (tp === 'blood') ? 'block' : 'none';
        document.getElementById('hlNoteInput').style.display = (tp === 'blood') ? 'none' : 'block';
    };

    // ---------- 입력: 편집 표 ----------
    function hlItemRowHtml(it) {
        const cls = it.parseFailed ? 'failed' : (it.abnormal ? 'abnormal' : '');
        const val = it.value != null ? it.value : (it.raw || '');
        const esc = s => String(s == null ? '' : s).replace(/"/g, '&quot;').replace(/</g, '&lt;');
        return `<tr class="${cls}">
            <td><input class="hl-i-name" value="${esc(it.name)}"></td>
            <td><input class="hl-i-val" value="${esc(val)}" data-raw="${esc(it.raw || '')}"></td>
            <td><input class="hl-i-unit" value="${esc(it.unit)}"></td>
            <td><input class="hl-i-ref" value="${esc(it.refText)}"></td>
            <td class="hl-del" onclick="hlDeleteRow(this)">✕</td>
        </tr>`;
    }
    function hlRenderItemsTable(items) {
        const wrap = document.getElementById('hlItemsWrap');
        if (!items || !items.length) { wrap.innerHTML = ''; return; }
        wrap.innerHTML = `
            <table class="hl-items-table">
                <thead><tr>
                    <th class="hl-col-name">항목명</th><th class="hl-col-val">값</th>
                    <th class="hl-col-unit">단위</th><th class="hl-col-ref">참고치</th><th class="hl-col-x"></th>
                </tr></thead>
                <tbody id="hlItemsBody">${items.map(hlItemRowHtml).join('')}</tbody>
            </table>
            <div class="hl-btnrow"><button type="button" class="hl-addrow-btn" onclick="hlAddRow()">+ 행 추가</button></div>`;
    }
    window.hlAddRow = function() {
        const body = document.getElementById('hlItemsBody');
        if (!body) { hlRenderItemsTable([{ name: '', value: null, raw: '', unit: '', refText: '', abnormal: false, parseFailed: false }]); return; }
        body.insertAdjacentHTML('beforeend', hlItemRowHtml({ name: '', value: null, raw: '', unit: '', refText: '', abnormal: false, parseFailed: false }));
    };
    window.hlDeleteRow = function(td) { td.closest('tr').remove(); };

    // 표 → items 배열 (저장 시 재구성: 값 재파싱 + abnormal 재계산)
    function hlRowsToItems() {
        const rows = document.querySelectorAll('#hlItemsBody tr');
        const items = [];
        rows.forEach(tr => {
            const name = tr.querySelector('.hl-i-name').value.trim();
            const valInput = tr.querySelector('.hl-i-val');
            const valStr = valInput.value.trim();
            const unit = tr.querySelector('.hl-i-unit').value.trim();
            const refText = tr.querySelector('.hl-i-ref').value.trim();
            if (!name && !valStr) return;                 // 빈 행 무시
            const res = hlParseResult(valStr);
            const ref = hlParseRef(refText);
            const abnormal = (res.value != null && (ref.refLow != null || ref.refHigh != null))
                ? (ref.refLow != null && res.value < ref.refLow) || (ref.refHigh != null && res.value > ref.refHigh)
                : res.abnormal;
            items.push({
                name, value: res.value, raw: valStr,
                unit: unit || ref.unit || '', refLow: ref.refLow, refHigh: ref.refHigh,
                refText, abnormal, parseFailed: res.value == null,
            });
        });
        return items;
    }

    document.getElementById('hlParseBtn').addEventListener('click', () => {
        const text = document.getElementById('hlPaste').value;
        const r = hlParseBloodTest(text);
        if (r.date && !document.getElementById('hlDate').value) document.getElementById('hlDate').value = r.date;
        if (r.hospital && !document.getElementById('hlHospital').value) document.getElementById('hlHospital').value = r.hospital;
        hlRenderItemsTable(r.items);
        const failed = r.items.filter(i => i.parseFailed).length;
        document.getElementById('hlParseInfo').innerHTML =
            `인식 ${r.items.length}개 항목` +
            (failed ? ` · <span style="color:#f59f00;">숫자 인식 실패 ${failed}개(노란 행)</span>` : '') +
            (r.date ? ` · 채취일 ${r.date}` : '') +
            (r.hospital ? ` · ${r.hospital}` : '') +
            ` — 아래 표에서 확인·수정 후 저장하세요.`;
    });

    // ---------- 저장/수정/삭제 ----------
    function hlMsg(text, ok) {
        const el = document.getElementById('hlSaveMsg');
        el.textContent = text; el.style.color = ok ? '#40c057' : '#e03131';
        if (ok) setTimeout(() => { el.textContent = ''; }, 2000);
    }
    async function hlSave() {
        const date = document.getElementById('hlDate').value;
        if (!date) return hlMsg('날짜를 입력해주세요.');
        const hospital = document.getElementById('hlHospital').value.trim();
        const now = Date.now();
        const data = { person: hlPerson, type: hlType, date, hospital, updatedAt: now };
        if (hlType === 'blood') { data.items = hlRowsToItems(); data.note = ''; }
        else { data.items = []; data.note = document.getElementById('hlNote').value; }

        const btn = document.getElementById('hlSaveBtn');
        btn.disabled = true;
        try {
            if (hlEditId) await updateDoc(doc(db, HEALTH_COLLECTION, hlEditId), data);
            else { data.createdAt = now; await addDoc(collection(db, HEALTH_COLLECTION), data); }
            await hlFetch();
            hlResetInput();
            hlMsg('✓ 저장되었습니다', true);
        } catch (e) { console.error('건강기록 저장 실패:', e); hlMsg('저장 실패 — 다시 시도해주세요'); }
        finally { btn.disabled = false; }
    }
    function hlResetInput() {
        hlEditId = null;
        document.getElementById('hlDate').value = '';
        document.getElementById('hlHospital').value = '';
        document.getElementById('hlPaste').value = '';
        document.getElementById('hlNote').value = '';
        document.getElementById('hlItemsWrap').innerHTML = '';
        document.getElementById('hlParseInfo').innerHTML = '';
        document.getElementById('hlCancelEdit').style.display = 'none';
        document.getElementById('hlSaveBtn').textContent = '저장';
        hlSetType('blood');
    }
    document.getElementById('hlSaveBtn').addEventListener('click', hlSave);
    document.getElementById('hlCancelEdit').addEventListener('click', hlResetInput);

    window.hlEdit = function(id) {
        const r = hlRecords.find(x => x.id === id);
        if (!r) return;
        hlEditId = id;
        hlPerson = r.person; hlSetPerson(r.person);
        hlSetType(r.type || 'blood');
        document.getElementById('hlDate').value = r.date || '';
        document.getElementById('hlHospital').value = r.hospital || '';
        if ((r.type || 'blood') === 'blood') { hlRenderItemsTable(r.items || []); document.getElementById('hlParseInfo').innerHTML = '수정 중 — 표를 고치고 저장하세요.'; }
        else { document.getElementById('hlNote').value = r.note || ''; }
        document.getElementById('hlSaveBtn').textContent = '수정 저장';
        document.getElementById('hlCancelEdit').style.display = 'block';
        hlSetView('input');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    window.hlDelete = async function(id) {
        if (!confirm('이 기록을 삭제할까요?')) return;
        try { await deleteDoc(doc(db, HEALTH_COLLECTION, id)); await hlFetch(); hlRenderList(); }
        catch (e) { console.error('삭제 실패:', e); }
    };
    window.hlToggleRec = function(id) {
        const el = document.getElementById('hlbody-' + id);
        if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    };

    // ---------- 기록 목록 ----------
    const HL_TYPE_LABEL = { blood: '혈액', endoscopy: '내시경', other: '기타' };
    function hlEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function hlAttr(s) { return hlEsc(s).replace(/"/g, '&quot;'); }
    // 항목 설명 물음표 토글 (마우스오버는 title, 클릭은 아래 desc 표시)
    window.hlToggleInfo = function(el) {
        const d = el.nextElementSibling;
        if (d) d.style.display = (d.style.display === 'none') ? 'block' : 'none';
    };
    function hlRenderList() {
        const wrap = document.getElementById('hlList');
        const recs = hlRecords.filter(r => r.person === hlPerson)
            .sort((a, b) => (a.date || '') < (b.date || '') ? 1 : (a.date || '') > (b.date || '') ? -1 : 0);
        if (!recs.length) { wrap.innerHTML = `<div class="a10-empty">${hlPerson}의 건강기록이 없습니다.<br>“기록 입력”에서 추가하세요.</div>`; return; }
        wrap.innerHTML = recs.map(r => {
            const type = r.type || 'blood';
            const abn = (r.items || []).filter(i => i.abnormal).length;
            let body = '';
            if (type === 'blood') {
                const rows = (r.items || []).map(i => {
                    // 표시만 정규화한다. 저장된 i.name 은 건드리지 않는다.
                    const orig = String(i.name == null ? '' : i.name).replace(/\s+/g, ' ').trim();
                    const dn = hlNormalizeName(orig);
                    const inf = hlInfo(dn);
                    const help = inf && inf.desc
                        ? ` <span class="hl-info" title="${hlAttr(inf.desc)}" onclick="hlToggleInfo(this)">?</span><span class="hl-info-desc" style="display:none">${hlEsc(inf.desc)}</span>`
                        : '';
                    const nameTitle = (dn !== orig) ? ` title="결과지 원본: ${hlAttr(orig)}"` : '';
                    return `<tr class="${i.abnormal ? 'abnormal' : ''}">
                    <td${nameTitle}>${hlEsc(dn)}${help}</td>
                    <td class="hl-v">${hlEsc(i.value != null ? i.value : i.raw)}${i.abnormal ? ' <span class="hl-abn-mark">▲▼</span>' : ''}</td>
                    <td>${hlEsc(hlDisplayUnit(i.unit))}</td><td>${hlEsc(i.refText)}</td></tr>`;
                }).join('');
                body = `<div class="hl-rec-body" id="hlbody-${r.id}" style="display:none">
                    <table class="hl-view-table"><thead><tr><th>항목</th><th>값</th><th>단위</th><th>참고치</th></tr></thead><tbody>${rows}</tbody></table></div>`;
            } else {
                body = `<div class="hl-rec-body" id="hlbody-${r.id}" style="display:none"><div class="hl-rec-note">${hlEsc(r.note)}</div></div>`;
            }
            return `<div class="hl-rec">
                <div class="hl-rec-head" onclick="hlToggleRec('${r.id}')">
                    <span class="hl-rec-date">${hlEsc(r.date)}</span>
                    <span class="hl-rec-badge hl-badge-${type}">${HL_TYPE_LABEL[type] || type}</span>
                    ${r.hospital ? `<span class="hl-rec-hosp">${hlEsc(r.hospital)}</span>` : ''}
                    ${abn ? `<span class="hl-rec-ab">이상 ${abn}</span>` : ''}
                </div>
                ${body}
                <div class="hl-rec-actions">
                    <button class="hl-mini-btn hl-mini-edit" onclick="hlEdit('${r.id}')">수정</button>
                    <button class="hl-mini-btn hl-mini-del" onclick="hlDelete('${r.id}')">삭제</button>
                </div>
            </div>`;
        }).join('');
    }

    // ---------- 수치 흐름 (Chart.js 재사용) ----------
    // 항목명 → 카테고리 (사전 기반)
    function hlItemCategory(name) {
        const cats = {
            '갑상선': ['TSH', 'Free T4', 'T3 (Triiodothyronine)', 'Free T3', 'TSH Receptor Ab (TSI/TBII)', 'Anti Microsomal Ab (Anti TPO Ab)', 'Thyroglobulin Ab', 'TSI Bioassay', 'HbA1c'],
            '당·지질': ['Glucose', 'HbA1c-IFCC', 'HbA1c-eAG', 'Total Cholesterol', 'Triglycerides', 'HDL-Cholesterol', 'LDL-Cholesterol', 'beta-hydroxybutyrate (ketone body)'],
            '콩팥·전해질': ['Urea Nitrogen', 'Creatinine', 'eGFR(CKD-EPI 2021)', 'eGFR(CKD-EPI 2009)', 'IDMS-traceable MDRD-eGFR', 'Uric acid', 'Sodium', 'Potassium', 'Chloride', 'Calcium (Ca)', 'Phosphorus (P)'],
            '간·단백': ['AST(GOT)', 'ALT(GPT)', 'γ-GTP', 'Alkaline Phosphatase', 'Total Bilirubin', 'Total Protein', 'Albumin', 'CPK'],
            '혈액(CBC)': ['WBC', 'RBC', 'Hemoglobin', 'Hematocrit', 'Platelet', 'MCV', 'MCH', 'MCHC', 'Segmented neutrophil', 'Neutrophil band', 'Lymphocyte', 'Monocyte', 'Eosinophil', 'Basophil'],
            '종양표지자·기타': ['AFP', 'CEA', 'CA19-9', 'CA125', 'PSA', '25-OH vitamin D', 'Systolic blood viscosity', 'Diastolic blood viscosity'],
        };
        for (const [cat, items] of Object.entries(cats)) if (items.includes(name)) return cat;
        return null;
    }
    // 혈액검사 항목을 카테고리별·빈도순으로 정렬해 반환한다.
    function hlBloodItemNames(person) {
        const count = new Map();  // 정규화된 항목명 → 카운트
        hlRecords.filter(r => r.person === person && (r.type || 'blood') === 'blood')
            .forEach(r => (r.items || []).forEach(i => {
                if (i.value != null && i.name) {
                    const norm = hlNormalizeName(i.name);
                    count.set(norm, (count.get(norm) || 0) + 1);
                }
            }));
        // 카테고리별로 그룹화
        const CAT_ORDER = ['갑상선', '당·지질', '콩팥·전해질', '간·단백', '혈액(CBC)', '종양표지자·기타'];
        const cats = new Map(CAT_ORDER.map(c => [c, []]));
        count.forEach((cnt, name) => {
            const cat = hlItemCategory(name) || '종양표지자·기타';
            if (!cats.has(cat)) cats.set(cat, []);
            cats.get(cat).push({ name, cnt });
        });
        // 각 카테고리를 빈도순(내림차순)으로 정렬
        const result = [];
        for (const cat of CAT_ORDER) {
            const items = cats.get(cat) || [];
            items.sort((a, b) => b.cnt - a.cnt || a.name.localeCompare(b.name, 'ko'));
            result.push(...items.map(x => x.name));
        }
        return result;
    }
    // 날짜 문자열(YYYY-MM-DD) → 그날 자정의 로컬 타임스탬프. 형식이 아니면 null.
    // new Date('2026-07-02')는 UTC로 읽혀 하루 밀릴 수 있어 직접 만든다.
    function hlDateTs(d) {
        const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(d == null ? '' : d).trim());
        return m ? new Date(+m[1], +m[2] - 1, +m[3]).getTime() : null;
    }
    // 날짜 어댑터(chartjs-adapter-date-fns)가 실제로 붙었는지 확인한다.
    // 없으면 time scale이 예외를 던지므로, 미리 확인해 예전 방식(등간격)으로 그린다.
    let hlDateAdapterState = null;
    function hlDateAdapterOk() {
        if (hlDateAdapterState !== null) return hlDateAdapterState;
        try {
            const A = (typeof Chart !== 'undefined') && Chart._adapters && Chart._adapters._date;
            const inst = A ? new A({}) : null;
            hlDateAdapterState = !!inst && typeof inst.parse === 'function' && typeof inst.parse(new Date()) === 'number';
        } catch (e) { hlDateAdapterState = false; }
        return hlDateAdapterState;
    }
    const HL_RANGE_LABEL = { '1y': '1년', '3y': '3년', 'all': '전체' };
    // 선택한 기간의 시작 시각. '전체'면 null(자르지 않음).
    function hlRangeCutoff() {
        const t = new Date();
        if (hlChartRange === '1y') return new Date(t.getFullYear() - 1, t.getMonth(), t.getDate()).getTime();
        if (hlChartRange === '3y') return new Date(t.getFullYear() - 3, t.getMonth(), t.getDate()).getTime();
        return null;
    }
    window.hlSetChartRange = function (v) {
        hlChartRange = v;
        document.querySelectorAll('[data-hrange]').forEach(b => b.classList.toggle('active', b.dataset.hrange === v));
        hlRenderChart();
    };

    // 한 항목의 차트 설정(config)을 만든다. 개별 보기와 묶음 보기가 함께 쓴다.
    // 반환 kind: 'lib'(라이브러리 없음) | 'no-item'(항목 기록 없음)
    //          | 'no-range'(기간 밖) | 'ok'(config, meta 포함)
    // opts.xMin/xMax: time scale일 때 x축 범위를 강제로 맞춘다(묶음 정렬용).
    function hlMakeChartConfig(itemName, opts) {
        opts = opts || {};
        if (typeof Chart === 'undefined') return { kind: 'lib' };

        const all = []; let refLow = null, refHigh = null, unit = '';
        hlRecords.filter(r => r.person === hlPerson && (r.type || 'blood') === 'blood')
            .forEach(r => { const it = (r.items || []).find(x => x.name && hlNormalizeName(x.name) === itemName); if (it && it.value != null) { all.push({ date: r.date, ts: hlDateTs(r.date), value: it.value }); if (it.refLow != null) refLow = it.refLow; if (it.refHigh != null) refHigh = it.refHigh; if (it.unit) unit = hlDisplayUnit(it.unit); } });
        all.sort((a, b) => (a.date || '') < (b.date || '') ? -1 : 1);
        if (!all.length) return { kind: 'no-item' };

        const cutoff = hlRangeCutoff();
        const pts = (cutoff == null) ? all : all.filter(p => p.ts == null || p.ts >= cutoff);
        if (!pts.length) return { kind: 'no-range', all };

        // 실제 날짜 간격으로 그릴 수 있는 조건: 어댑터가 있고, 모든 기록의 날짜를 읽었을 때
        const useTime = hlDateAdapterOk() && pts.every(p => p.ts != null);
        const labels = pts.map(p => (p.date || '').substring(2).replace(/-/g, '/'));
        const values = pts.map(p => p.value);
        const mk = arr => useTime ? arr.map((v, i) => ({ x: pts[i].ts, y: v })) : arr;

        const datasets = [];
        // 참고치 배경 영역 (상·하한 둘 다 있으면 밴드, 하나면 점선)
        if (refLow != null && refHigh != null) {
            datasets.push({ label: '상한', data: mk(values.map(() => refHigh)), borderColor: 'rgba(12,166,120,0.45)', borderDash: [4, 4], pointRadius: 0, fill: '+1', backgroundColor: 'rgba(12,166,120,0.10)' });
            datasets.push({ label: '하한', data: mk(values.map(() => refLow)), borderColor: 'rgba(12,166,120,0.45)', borderDash: [4, 4], pointRadius: 0, fill: false });
        } else if (refHigh != null) {
            datasets.push({ label: '상한', data: mk(values.map(() => refHigh)), borderColor: 'rgba(12,166,120,0.45)', borderDash: [4, 4], pointRadius: 0, fill: false });
        } else if (refLow != null) {
            datasets.push({ label: '하한', data: mk(values.map(() => refLow)), borderColor: 'rgba(12,166,120,0.45)', borderDash: [4, 4], pointRadius: 0, fill: false });
        }
        const valueDsIndex = datasets.length;
        const ext = chartExtremeOverlay(values, 4, 6);
        datasets.push({
            label: itemName, data: mk(values), borderColor: '#364fc7', backgroundColor: 'rgba(54,79,199,0.06)',
            pointBackgroundColor: pts.map(p => ((refLow != null && p.value < refLow) || (refHigh != null && p.value > refHigh)) ? '#e03131' : '#364fc7'),
            pointBorderColor: ext.pointBorderColor, pointBorderWidth: ext.pointBorderWidth,
            pointStyle: ext.pointStyle, pointRotation: ext.pointRotation,
            pointRadius: ext.pointRadius, pointHoverRadius: ext.pointHoverRadius,
            tension: 0.2, fill: false,
        });

        // x축: 단위(일/월/년)는 Chart.js가 기간을 보고 고르게 두고, 겹침만 막는다
        const xScale = useTime
            ? {
                type: 'time',
                time: { displayFormats: { day: 'MM/dd', week: 'yy/MM/dd', month: 'yy/MM', quarter: 'yy/MM', year: 'yyyy' } },
                grid: { display: false },
                ticks: { autoSkip: true, maxRotation: 0, maxTicksLimit: 8, font: { size: 11 } },
              }
            : { grid: { display: false } };
        if (useTime) {
            const forced = (opts.xMin != null && opts.xMax != null && opts.xMin !== opts.xMax);
            if (forced) {
                // 묶음 보기: 모든 작은 차트의 x축을 같은 범위로 맞춘다
                xScale.min = opts.xMin; xScale.max = opts.xMax;
            } else {
                // 개별 보기(및 강제범위 없음): 점이 하나뿐이면 폭이 0이라 밀리초 눈금이 생긴다.
                // 앞뒤로 보름씩 벌려 날짜 눈금이 나오게 한다. 여러 점이면 예전처럼 자동에 맡긴다.
                const tMin = Math.min.apply(null, pts.map(p => p.ts));
                const tMax = Math.max.apply(null, pts.map(p => p.ts));
                if (tMin === tMax) {
                    const pad = 15 * 24 * 60 * 60 * 1000;
                    xScale.min = tMin - pad; xScale.max = tMax + pad;
                    xScale.time.unit = 'day';
                }
            }
        }

        const config = {
            type: 'line',
            data: { labels: useTime ? undefined : labels, datasets },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: { filter: c => c.datasetIndex === valueDsIndex, callbacks: { title: c => pts[c[0].dataIndex].date, label: c => `${itemName}: ${c.parsed.y}${unit ? ' ' + unit : ''}${chartExtremeNote(ext, c.dataIndex)}` } }
                },
                scales: { x: xScale }
            }
        };
        return { kind: 'ok', config, meta: { pts, all, refLow, refHigh, unit, values, useTime, ext, cutoff, valueDsIndex } };
    }

    // 묶음 보기의 작은 차트들을 모두 정리한다(메모리 누수·잔상 방지)
    function hlDestroyGroupCharts() {
        hlGroupCharts.forEach(c => { try { c.destroy(); } catch (e) {} });
        hlGroupCharts = [];
    }

    function hlRenderChart() {
        const sel = document.getElementById('hlChartItem');
        const names = hlBloodItemNames(hlPerson);
        const prev = sel.value;
        sel.innerHTML = names.map(n => {
            const inf = hlInfo(n);
            const label = inf && inf.short ? `${n} — ${inf.short}` : n;
            return `<option value="${hlEsc(n)}">${hlEsc(label)}</option>`;
        }).join('');
        if (names.includes(prev)) sel.value = prev;

        const canvas = document.getElementById('hlChart');
        const statsEl = document.getElementById('hlChartStats');
        const msgEl = document.getElementById('hlChartMsg');
        const rangeRow = document.getElementById('hlChartRangeRow');
        const modeRow = document.getElementById('hlChartModeRow');
        const detailEl = document.getElementById('hlChartDetail');
        const singleWrap = document.getElementById('hlChartSingle');
        const groupWrap = document.getElementById('hlChartGroup');
        document.querySelectorAll('[data-hcmode]').forEach(b => b.classList.toggle('active', b.dataset.hcmode === hlChartMode));

        // 항목 자체가 없으면 모드 상관없이 공통 빈 안내
        if (typeof Chart === 'undefined' || !names.length) {
            if (hlChartInstance) { hlChartInstance.destroy(); hlChartInstance = null; }
            hlDestroyGroupCharts();
            singleWrap.style.display = ''; groupWrap.style.display = 'none';
            if (modeRow) modeRow.style.display = 'none';
            if (rangeRow) rangeRow.style.display = 'none';
            if (detailEl) detailEl.style.display = 'none';
            statsEl.innerHTML = ''; sel.style.display = 'none'; canvas.style.display = 'none';
            msgEl.innerHTML = (typeof Chart === 'undefined')
                ? '<div class="a10-empty">차트 라이브러리를 불러오지 못했습니다.</div>'
                : `<div class="a10-empty">${hlPerson}의 혈액검사 수치가 없습니다.</div>`;
            return;
        }
        if (modeRow) modeRow.style.display = '';
        if (rangeRow) rangeRow.style.display = '';

        // 묶음 보기로 위임
        if (hlChartMode === 'group') {
            if (hlChartInstance) { hlChartInstance.destroy(); hlChartInstance = null; }
            singleWrap.style.display = 'none'; groupWrap.style.display = '';
            hlRenderGroup();
            return;
        }

        // ── 개별 보기 ──
        hlDestroyGroupCharts();
        singleWrap.style.display = ''; groupWrap.style.display = 'none';
        sel.style.display = '';
        if (hlChartInstance) { hlChartInstance.destroy(); hlChartInstance = null; }

        const itemName = sel.value;
        // 선택 항목 상세 설명 (detail 우선, 없으면 desc, 둘 다 없으면 숨김)
        if (detailEl) {
            const inf = hlInfo(itemName);
            const text = inf && (inf.detail || inf.desc);
            if (text) { detailEl.innerHTML = `<b>${hlEsc(itemName)}</b>${hlEsc(text)}`; detailEl.style.display = ''; }
            else { detailEl.innerHTML = ''; detailEl.style.display = 'none'; }
        }

        const res = hlMakeChartConfig(itemName);
        if (res.kind === 'no-item') { canvas.style.display = 'none'; statsEl.innerHTML = ''; msgEl.innerHTML = '<div class="a10-empty">이 항목의 수치가 없습니다.</div>'; return; }
        if (res.kind === 'no-range') {
            canvas.style.display = 'none'; statsEl.innerHTML = '';
            msgEl.innerHTML = `<div class="a10-empty">최근 ${HL_RANGE_LABEL[hlChartRange] || ''} 안에는 이 항목의 기록이 없습니다.<br>‘전체’를 누르면 ${res.all.length}건이 있습니다.</div>`;
            return;
        }
        canvas.style.display = '';

        try {
            hlChartInstance = new Chart(canvas, res.config);
        } catch (e) {
            console.error('차트 생성 실패:', e);
            hlChartInstance = null;
            canvas.style.display = 'none'; statsEl.innerHTML = '';
            msgEl.innerHTML = '<div class="a10-empty">차트를 그리지 못했습니다.<br>새로고침 후에도 같으면 알려주세요.</div>';
            return;
        }

        const m = res.meta;
        const values = m.values, refLow = m.refLow, refHigh = m.refHigh, unit = m.unit, pts = m.pts, all = m.all, cutoff = m.cutoff;
        const mn = Math.min(...values), mx = Math.max(...values), first = values[0], last = values[values.length - 1];
        let html = `<span>최소 <b>${mn}</b></span><span>최대 <b>${mx}</b></span>`;
        if (values.length >= 2 && first) { const chg = (last - first) / first * 100; html += `<span>변화 <b class="${chg > 0 ? 'up' : chg < 0 ? 'down' : ''}">${chg > 0 ? '+' : ''}${chg.toFixed(1)}%</b></span>`; }
        if (refLow != null || refHigh != null) html += `<span class="hl-ref">참고 ${refLow != null ? refLow : ''}~${refHigh != null ? refHigh : ''}${unit ? ' ' + unit : ''}</span>`;
        if (cutoff != null && pts.length < all.length) html += `<span>${HL_RANGE_LABEL[hlChartRange]} ${pts.length}건 / 전체 ${all.length}건</span>`;
        statsEl.innerHTML = html;

        const notes = [];
        if (values.length === 1) notes.push('기록이 1건이라 흐름은 다음 기록부터 보입니다.');
        if (!m.useTime) notes.push(hlDateAdapterOk()
            ? '날짜를 읽지 못한 기록이 있어 예전처럼 등간격으로 그렸습니다.'
            : '날짜 축 라이브러리를 불러오지 못해 등간격으로 그렸습니다. (간격이 실제 기간과 다릅니다)');
        msgEl.innerHTML = notes.length ? `<div class="a10-hint">${notes.join('<br>')}</div>` : '';
    }

    // 묶음 선택 버튼 렌더
    function hlBuildGroupSel() {
        const el = document.getElementById('hlGroupSel');
        if (!el) return;
        el.innerHTML = Object.keys(HL_GROUPS).map(k =>
            `<button class="hl-chip group${k === hlGroupKey ? ' active' : ''}" data-hgroup="${k}" onclick="hlSetGroup('${k}')">${hlEsc(HL_GROUPS[k].label)}</button>`
        ).join('');
    }

    // 묶음 보기: 묶음 안 항목들을 작은 선차트로 배치. x축(기간)은 전 항목 공통으로 맞춘다.
    function hlRenderGroup() {
        hlBuildGroupSel();
        const grid = document.getElementById('hlGroupGrid');
        const msg = document.getElementById('hlGroupMsg');
        hlDestroyGroupCharts();
        grid.innerHTML = '';

        const grp = HL_GROUPS[hlGroupKey];
        if (!grp) { msg.innerHTML = ''; return; }

        // 1) 각 항목 config를 만들고, time scale로 그릴 수 있는 항목들의 x 범위를 모은다
        const built = [];
        let gMin = Infinity, gMax = -Infinity;
        for (const item of grp.items) {
            const r = hlMakeChartConfig(item);
            if (r.kind !== 'ok') continue;           // 데이터 없는 항목은 건너뜀
            built.push({ item, res: r });
            if (r.meta.useTime) r.meta.pts.forEach(p => { if (p.ts != null) { if (p.ts < gMin) gMin = p.ts; if (p.ts > gMax) gMax = p.ts; } });
        }

        if (!built.length) {
            msg.innerHTML = `<div class="a10-empty">${hlPerson}의 ‘${hlEsc(grp.label)}’ 묶음에는 표시할 수치가 없습니다.<br>기간을 ‘전체’로 바꿔보거나 다른 묶음을 선택하세요.</div>`;
            return;
        }
        msg.innerHTML = '';

        const haveDomain = gMin !== Infinity && gMax !== -Infinity && gMin !== gMax;

        // 2) 공통 x범위를 강제해 다시 만들어 그린다(위아래 정렬)
        for (const b of built) {
            const res = haveDomain ? hlMakeChartConfig(b.item, { xMin: gMin, xMax: gMax }) : b.res;
            if (res.kind !== 'ok') continue;

            const cell = document.createElement('div');
            const title = document.createElement('div');
            title.className = 'hl-group-title';
            const inf = hlInfo(b.item);
            title.textContent = inf && inf.short ? `${b.item} — ${inf.short}` : b.item;
            const box = document.createElement('div');
            box.className = 'hl-group-box';
            const cv = document.createElement('canvas');
            box.appendChild(cv);
            cell.appendChild(title);
            cell.appendChild(box);
            grid.appendChild(cell);

            try { hlGroupCharts.push(new Chart(cv, res.config)); }
            catch (e) { console.error('묶음 차트 실패:', b.item, e); }
        }
    }

    window.hlSetChartMode = function (m) {
        hlChartMode = m;
        hlRenderChart();
    };
    window.hlSetGroup = function (k) {
        hlGroupKey = k;
        hlRenderChart();
    };
    window.hlRenderChart = hlRenderChart;

    /* ===================== 로그인 게이트 =====================
       - 로그인 전: #loginScreen 만 표시, 메인(.container) 숨김
       - 로그인 후: 메인 표시 + startTodoData()로 tasks 구독 시작
       - After10 diary 조회는 탭 클릭 시(a10LoadEntries)라 이미 로그인 이후에만 실행됨
    ========================================================== */
    const auth = getAuth(app);

    const loginScreenEl = document.getElementById('loginScreen');
    const containerEl   = document.querySelector('.container');
    const logoutBtnEl   = document.getElementById('logoutBtn');
    const loginEmailEl  = document.getElementById('loginEmail');
    const loginPwEl     = document.getElementById('loginPassword');
    const loginBtnEl    = document.getElementById('loginBtn');
    const loginErrorEl  = document.getElementById('loginError');

    function showLoginError(msg) {
        loginErrorEl.textContent = msg;
        loginErrorEl.style.display = 'block';
    }

    async function doLogin() {
        const email = loginEmailEl.value.trim();
        const pw = loginPwEl.value;
        loginErrorEl.style.display = 'none';
        if (!email || !pw) {
            showLoginError('이메일과 비밀번호를 입력해주세요.');
            return;
        }
        loginBtnEl.disabled = true;
        loginBtnEl.textContent = '로그인 중...';
        try {
            await signInWithEmailAndPassword(auth, email, pw);
            // 성공 시 onAuthStateChanged가 화면 전환/데이터 로딩 처리
        } catch (e) {
            showLoginError('로그인에 실패했습니다. 이메일과 비밀번호를 확인해주세요.');
            loginBtnEl.disabled = false;
            loginBtnEl.textContent = '로그인';
        }
    }

    loginBtnEl.addEventListener('click', doLogin);
    loginEmailEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginPwEl.focus(); });
    loginPwEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    logoutBtnEl.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
        if (user) {
            // 로그인됨 → 메인 표시 후 데이터 로딩 시작
            loginScreenEl.style.display = 'none';
            containerEl.style.display = 'block';
            logoutBtnEl.style.display = 'block';
            startTodoData();
        } else {
            // 로그인 안 됨 → 구독 해제 후 로그인 화면만
            stopTodoData();
            containerEl.style.display = 'none';
            logoutBtnEl.style.display = 'none';
            loginScreenEl.style.display = 'flex';
            loginErrorEl.style.display = 'none';
            loginPwEl.value = '';
            loginBtnEl.disabled = false;
            loginBtnEl.textContent = '로그인';
        }
    });
</script>

</body>
</html>
